<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PMP Prep Portal — Mock Tests</title>
<style>
  :root{
    --navy:#0f2942; --blue:#1f6fb2; --lightblue:#eaf3fb; --green:#1e7d3c; --green-bg:#e8f6ec;
    --red:#c0392b; --red-bg:#fdecea; --amber:#b8860b; --gray:#5b6470; --border:#dfe6ee;
    --card:#ffffff; --bg:#f4f7fa;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:#1c2733;line-height:1.5;}
  header{background:var(--navy);color:#fff;padding:26px 20px;text-align:center;position:relative;}
  header h1{margin:0 0 6px;font-size:1.5rem;}
  header p{margin:4px 0;opacity:.85;font-size:.9rem;}
  .topbar-row{max-width:880px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;font-size:.82rem;padding-top:2px;}
  .topbar-row span{opacity:.85;}
  .topbar-row a, .link-btn{color:#bfe0ff;cursor:pointer;text-decoration:underline;background:none;border:none;font-size:.82rem;padding:0;}
  .wrap{max-width:880px;margin:0 auto;padding:24px 16px 80px;}

  .center-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:32px;max-width:440px;margin:40px auto;text-align:center;}
  .center-card h2{margin-top:0;color:var(--navy);font-size:1.25rem;}
  .center-card p{color:var(--gray);font-size:.9rem;margin-bottom:22px;}
  .center-card input[type=text],.center-card input[type=password]{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:8px;font-size:1rem;margin-bottom:14px;}
  .role-row{display:flex;gap:10px;justify-content:center;margin-top:6px;flex-wrap:wrap;}
  .btn-primary{background:var(--blue);color:#fff;border:none;padding:12px 26px;border-radius:8px;font-size:1rem;cursor:pointer;font-weight:600;}
  .btn-primary:hover{background:#175a90;}
  .btn-primary:disabled{background:#9fb8c9;cursor:not-allowed;}
  .btn-secondary{background:#fff;color:var(--blue);border:1px solid var(--blue);padding:11px 22px;border-radius:8px;font-size:.95rem;cursor:pointer;font-weight:600;}
  .btn-secondary:hover{background:var(--lightblue);}
  .trainer-link{margin-top:26px;font-size:.82rem;color:var(--gray);}
  .trainer-link button{background:none;border:none;color:var(--blue);text-decoration:underline;cursor:pointer;font-size:.82rem;padding:0;}

  .test-list-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
  .test-list-header h2{margin:0;color:var(--navy);font-size:1.15rem;}
  .test-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px 22px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;}
  .test-card h3{margin:0 0 4px;color:var(--navy);font-size:1.05rem;}
  .test-card p{margin:0;color:var(--gray);font-size:.85rem;}
  .attempt-badge{display:inline-block;margin-top:8px;font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:12px;background:var(--lightblue);color:var(--navy);}
  .coming-soon{color:var(--gray);font-size:.85rem;font-style:italic;padding:18px 0;text-align:center;border:1px dashed var(--border);border-radius:10px;}

  .intro-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px 22px;margin-bottom:22px;}
  .intro-card h2{margin-top:0;font-size:1.1rem;color:var(--navy);}
  .intro-card ul{margin:8px 0 0;padding-left:20px;}
  .intro-card li{margin-bottom:4px;font-size:.94rem;}
  .case-banner{background:var(--lightblue);border-left:4px solid var(--blue);border-radius:6px;padding:16px 18px;margin:28px 0 16px;}
  .case-banner h3{margin:0 0 6px;color:var(--navy);font-size:1.05rem;}
  .case-banner p{margin:8px 0 0;font-size:.92rem;color:#2b3948;}
  .q-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px 22px;margin-bottom:18px;}
  .q-meta{font-size:.78rem;text-transform:uppercase;letter-spacing:.03em;color:var(--gray);margin-bottom:6px;font-weight:600;}
  .q-num{color:var(--blue);}
  .q-stem{font-weight:600;margin:0 0 14px;font-size:1rem;color:#132436;}
  .select-hint{font-size:.82rem;color:var(--amber);font-weight:600;margin-bottom:10px;}
  .option{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;cursor:pointer;transition:.15s;}
  .option:hover{border-color:var(--blue);background:#f7fbfe;}
  .option input{margin-top:3px;flex-shrink:0;}
  .option label{cursor:pointer;font-size:.94rem;}
  .option.correct{background:var(--green-bg);border-color:var(--green);}
  .option.incorrect{background:var(--red-bg);border-color:var(--red);}
  .option.was-correct-not-picked{background:var(--green-bg);border-color:var(--green);border-style:dashed;}
  .result-tag{display:inline-block;font-size:.78rem;font-weight:700;padding:2px 8px;border-radius:12px;margin-left:8px;vertical-align:middle;}
  .tag-right{background:var(--green);color:#fff;}
  .tag-wrong{background:var(--red);color:#fff;}
  .explanation{display:none;margin-top:14px;padding:14px 16px;background:#fbfbf7;border:1px solid #ece6c8;border-radius:8px;font-size:.9rem;}
  .explanation.show{display:block;}
  .explanation h4{margin:0 0 6px;font-size:.85rem;color:var(--navy);}
  .explanation .rationale-line{margin:4px 0;}
  .explanation .why-best{margin-bottom:10px;}
  .chart-box{background:#fafcfe;border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-bottom:14px;}
  .chart-title{font-size:.85rem;font-weight:700;color:var(--navy);margin-bottom:10px;}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:.82rem;}
  .bar-label{width:120px;flex-shrink:0;color:#3a4552;}
  .bar-track{flex:1;background:#e6edf3;border-radius:4px;height:18px;position:relative;}
  .bar-fill{background:var(--blue);height:100%;border-radius:4px;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;color:#fff;font-size:.72rem;font-weight:700;}
  .bar-n{width:56px;flex-shrink:0;color:var(--gray);font-size:.75rem;}
  .target-note{font-size:.72rem;color:var(--red);margin:0 0 8px 130px;}
  table.dash{width:100%;border-collapse:collapse;font-size:.82rem;}
  table.dash th,table.dash td{border:1px solid var(--border);padding:6px 8px;text-align:left;}
  table.dash th{background:#eef3f8;}
  #progress-bar-outer{position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:10;}
  #progress-bar-track{background:#e0e7ee;border-radius:6px;height:8px;overflow:hidden;}
  #progress-bar-fill{background:var(--blue);height:100%;width:0%;transition:width .2s;}
  #progress-label{font-size:.78rem;color:var(--gray);margin-top:4px;text-align:right;}
  #submit-row{text-align:center;margin:30px 0;}
  #score-card{background:var(--card);border:2px solid var(--blue);border-radius:12px;padding:26px;text-align:center;margin-bottom:26px;}
  #score-card h2{margin:0 0 6px;color:var(--navy);}
  #score-big{font-size:2.6rem;font-weight:800;color:var(--blue);margin:6px 0;}
  #score-sub{color:var(--gray);font-size:.92rem;}
  .domain-breakdown{display:flex;gap:14px;justify-content:center;margin-top:18px;flex-wrap:wrap;}
  .domain-pill{background:var(--lightblue);border-radius:8px;padding:8px 14px;font-size:.82rem;color:var(--navy);}
  .hidden{display:none;}
  .unanswered-flag{color:var(--red);font-size:.78rem;font-weight:600;margin-left:8px;}
  footer{text-align:center;color:var(--gray);font-size:.78rem;padding:30px 16px;}

  .trainer-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:22px 24px;margin-bottom:18px;}
  .trainer-card h3{margin:0 0 8px;color:var(--navy);font-size:1.02rem;}
  .trainer-card p{font-size:.88rem;color:#2b3948;margin:6px 0;}
  .dashboard-link{display:inline-block;margin-top:10px;background:var(--navy);color:#fff;padding:11px 20px;border-radius:8px;text-decoration:none;font-size:.92rem;font-weight:600;}
  .dashboard-link:hover{background:#153a5c;}
  .local-table{width:100%;border-collapse:collapse;font-size:.84rem;margin-top:10px;}
  .local-table th,.local-table td{border:1px solid var(--border);padding:7px 10px;text-align:left;}
  .local-table th{background:#eef3f8;}
  .note-box{background:#fff8e6;border:1px solid #f0e0a8;border-radius:8px;padding:12px 14px;font-size:.82rem;color:#6b5410;margin-top:14px;}
</style>
</head>

<header>
  <h1 id="page-title">PMP Prep Portal</h1>
  <p id="page-subtitle">Scenario-based mock tests with instant grading and explanations</p>
  <div class="topbar-row" id="topbar-row"></div>
</header>

<div class="wrap" id="app"></div>

<footer>Original practice material — not an official PMI or PMI Study Hall product. Prepared for personal study use.</footer>

<!-- Hidden static form so Netlify's form-detection bot registers it at deploy time.
     Real submissions are sent via JS fetch() to "/" using these same field names. -->
<form name="mock-test-results" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="text" name="test_id" />
  <input type="text" name="test_title" />
  <input type="text" name="student_name" />
  <input type="text" name="score" />
  <input type="text" name="total" />
  <input type="text" name="percent" />
  <input type="text" name="domain_people" />
  <input type="text" name="domain_process" />
  <input type="text" name="domain_business" />
  <input type="text" name="timestamp" />
  <textarea name="answers_json"></textarea>
</form>

<script>
/* ============================================================
   DATA — Mock Test 01. Add future tests by inserting another
   entry into TESTS and pushing its id onto TEST_ORDER.
   ============================================================ */
const CASES_MT01 = {
  1: {
    title: "Case Study 1 — HarborGrid Port Modernization",
    subtitle: "Questions 1-4 | Hybrid | AI, sustainability, integrated planning, vision, value, and compliance",
    passage: `HarborGrid Authority is running a five-year modernization program for a busy international port. The initiative includes shore-power infrastructure so docked ships can switch off diesel engines, substation upgrades, an AI-supported berth-scheduling platform, and redesigned truck appointment processes. The board approved the investment because it is expected to reduce vessel waiting time, cut emissions, improve community health, and protect the port's ability to attract international shipping lines.<br><br>
    The physical infrastructure has fixed engineering standards, construction permits, safety inspections, and contractual milestones — managed predictively. The scheduling platform is developed by two cross-functional teams using three-week iterations because dispatchers, shipping lines, and truck operators expect to refine requirements after seeing working increments. Program-level release commitments, funding, and regulatory gates are integrated across both streams.<br><br>
    At the latest steering committee meeting, stakeholders used different definitions of success — CFO (payback period), operations director (vessel throughput), sustainability director (emissions), community representative (noise and truck congestion). All supported the vision but their trade-offs were inconsistent.<br><br>
    The AI team also built a berth-priority recommendation feature. Overall accuracy is strong, but smaller regional carriers are underrepresented in training/pilot data. A major demo is in two weeks; the product owner wants a broad release if the model hits the technical target.<br><br>
    A new national environmental directive requires auditable energy-consumption records and traceable renewable-energy claims, effective before HarborGrid's first release. The sponsor says it's "probably only a reporting matter" and wants to keep the release date.<br><br>
    Finally, the digital release plan depends on a meter-data interface from the shore-power workstream that can only be formally certified after hardware commissioning. The product owner proposes releasing the AI scheduling feature first using temporary manually uploaded meter data.`
  },
  2: {
    title: "Case Study 2 — CarePath AI Referral Platform",
    subtitle: "Questions 5-8 | Adaptive with mandatory governance gates | Stakeholders, knowledge, AI risk, and expectations",
    passage: `CarePath is a regional healthcare organization developing an AI-supported referral and appointment platform to reduce specialist waiting time while preserving clinical safety, patient privacy, and equitable access. Final clinical decisions remain with authorized healthcare professionals.<br><br>
    The project uses an adaptive approach for UX and model experimentation, with monthly releases to a controlled pilot. Privacy controls, security architecture, and clinical-safety approval go through mandatory governance gates. In the first pilot: waiting time -18% (target 20%), satisfaction 78% (target 85%), urban attendance +16%, rural attendance +2% (target 10%).<br><br>
    Rural clinicians say the system often offers appointment times impractical for patients on infrequent public transport. Patient advocates say the mobile interface assumes high digital literacy. The operations director wants wider release now; the clinical-safety lead disagrees because the privacy impact assessment is still awaiting formal approval and the rural-access result conflicts with the shared vision.<br><br>
    The lead data scientist — the only person who fully understands feature-engineering choices, model limitations, and bias-monitoring thresholds — resigns, leaving in twelve working days. Several data-exclusion and threshold decisions are undocumented. No replacement has been hired.<br><br>
    An AI risk tool rates harmful model bias as low because no serious incident occurred during the small pilot — but the tool doesn't account for the limited rural sample. The product owner asks the project manager to accept the rating and proceed because the pilot deadline is on the annual performance scorecard.`
  },
  3: {
    title: "Case Study 3 — RailSafe Signaling Upgrade",
    subtitle: "Questions 9-12 | Predictive | Graphic interpretation, finance, risk-to-issue, reserves, safety, and change governance",
    passage: `RailSafe Corporation is replacing an aging signaling system on a high-density commuter railway. The project is predominantly predictive — safety requirements, engineering interfaces, certification evidence, and cutover sequence are tightly controlled. A small simulation team uses short iterations to test operator scenarios, but scope, cost baseline, and regulatory acceptance gates remain under formal change control.<br><br>
    A specialist supplier is building a trackside communications module. The risk register flagged a possibility that a custom component could fail environmental testing; the approved response included an alternative component and USD 300,000 of contingency reserve. The project also has USD 600,000 of management reserve controlled by executive governance.<br><br>
    At the current status date, the environmental test fails. The supplier confirms the alternative component can be used, but it requires redesign of two interfaces and six additional weeks of integration testing. The sponsor proposes omitting one planned regression-test cycle to recover four weeks. The safety manager says that cycle is part of the approved certification evidence and cannot be removed without regulator agreement.<br><br>
    The financial management plan requires escalation when forecast exceeds the cost baseline by more than 5%, or when a safety-related change affects a certification gate. Current CPI ≈ 0.895; if performance continues, forecast EAC ≈ USD 13.41M against a BAC of USD 12.0M (VAC ≈ −USD 1.41M).<br><br>
    The sponsor says the failed component was already a known risk, so the project manager should just use the contingency reserve, update the schedule informally, and report the impact only after the supplier's final quotation.`
  }
};

const QUESTIONS_MT01 = [
{
  id:1, caseId:1, meta:"Lessons 2 and 5 | Process — Integrated planning | Hybrid | Single response",
  stem:"The temporary-data proposal could preserve the digital release date, but it introduces a new cross-workstream dependency and may affect data integrity, auditability, operational support, and later migration. What should the project manager do FIRST?",
  type:"single",
  options:[
    {k:"A", t:"Approve the temporary manual-data solution because adaptive delivery should preserve learning cadence, and record the interface replacement as technical debt."},
    {k:"B", t:"Ask the predictive infrastructure workstream to compress commissioning so certification finishes before the software release, then update the integrated schedule."},
    {k:"C", t:"Assess the dependency, release value, data-integrity and compliance implications, temporary-control risks, support effort, and transition path with the relevant product, engineering, operations, and compliance leads; then update the integrated plan and route the release decision through the appropriate governance path."},
    {k:"D", t:"Freeze all software releases until the shore-power interface has completed certification because hybrid delivery requires the predictive workstream to finish first."}
  ],
  answer:["C"],
  why:"The proposal is not simply an agile-versus-predictive choice. It changes how two workstreams integrate and may create data, support, audit, and transition risks. The project manager should first understand the integrated impact with the people who own those areas, then update the plan and use the established decision path. This preserves learning without bypassing enterprise controls.",
  notes:[
    "A: Plausible because a temporary solution can enable learning, but it approves a release before assessing compliance, data integrity, support, and transition consequences.",
    "B: Acceleration may become an option, but directing schedule compression before integrated analysis can create cost, quality, or safety consequences.",
    "D: Overly rigid. Hybrid tailoring does not require all predictive work to finish before adaptive value can be delivered; it requires dependencies and controls to be deliberately managed."
  ]
},
{
  id:2, caseId:1, meta:"Lesson 3 | People — Develop a common vision | Hybrid | Single response",
  stem:"The steering committee supports the project in principle, but its members judge success using different outcomes and make inconsistent trade-offs. What should the project manager do FIRST?",
  type:"single",
  options:[
    {k:"A", t:"Ask the sponsor to rank the financial, operational, sustainability, and community outcomes and publish the ranking as the decision rule."},
    {k:"B", t:"Facilitate a discussion that surfaces the different assumptions, reconnects them to the shared vision, and establishes agreed outcome measures and trade-off principles."},
    {k:"C", t:"Add all stakeholder measures to the dashboard and ask each workstream to optimize the measures most relevant to its scope."},
    {k:"D", t:"Use the business-case payback period as the primary success criterion because it was part of investment approval, while treating the other measures as secondary benefits."}
  ],
  answer:["B"],
  why:"Formal support does not equal shared understanding. The conflict is rooted in competing interpretations of value. The project manager should surface assumptions and facilitate agreement on outcomes and trade-off principles before forcing a ranking or merely reporting the conflict.",
  notes:[
    "A: Sponsor ranking may be required if governance owns the trade-off, but imposing a ranking before facilitated alignment bypasses an important project-management responsibility.",
    "C: A dashboard reveals differences but does not resolve conflicting decision logic.",
    "D: Financial return matters, but the approved vision explicitly includes operational, environmental, and community outcomes."
  ]
},
{
  id:3, caseId:1, meta:"Lesson 5 | Process — Value-based delivery | Adaptive / Hybrid | Graphic-based multiple response — Select THREE",
  stem:"Review the pilot performance chart. The technical target is at least 90% recommendation accuracy. Which THREE actions should the project manager support before a broad release?",
  type:"multi", selectN:3,
  chart:{title:"HarborGrid pilot — model performance by carrier segment (90% technical target)",
    bars:[{label:"Overall",pct:92,n:2880},{label:"Large carriers",pct:95,n:1900},{label:"Mid-size carriers",pct:93,n:900},{label:"Small regional",pct:74,n:80}],
    target:90},
  options:[
    {k:"A", t:"Treat the 92% overall result as sufficient because the approved technical target has been achieved."},
    {k:"B", t:"Validate the small-regional-carrier sample size, error pattern, and operational consequence of the lower segment result with analytics and business specialists."},
    {k:"C", t:"Confirm that acceptance criteria and the measurement system cover stakeholder impact, fairness, operational value, and service outcomes rather than only aggregate accuracy."},
    {k:"D", t:"Cancel the AI feature because any segment below the aggregate target proves the model is unsuitable for operational use."},
    {k:"E", t:"Evaluate a controlled release, targeted experiment, or additional validation that can generate decision evidence while limiting exposure, subject to risk and governance thresholds."}
  ],
  answer:["B","C","E"],
  why:"The graphic shows a strong aggregate result but a materially weaker small-regional-carrier result based on a very small sample. Before broad release, the team needs decision-quality evidence, acceptance measures that reflect intended stakeholder outcomes, and a controlled way to learn while limiting exposure.",
  notes:[
    "A: The aggregate target can hide material subgroup performance and does not address sample representativeness.",
    "D: A segment gap calls for analysis and controlled learning, not automatic cancellation of the entire feature."
  ]
},
{
  id:4, caseId:1, meta:"Lesson 5 | Business Environment — Compliance | Hybrid | Single response",
  stem:"The environmental directive becomes effective before the first operational release. The sponsor believes it may only require new reporting. What should the project manager do FIRST?",
  type:"single",
  options:[
    {k:"A", t:"Ask legal counsel to determine whether the directive applies, and wait for a formal legal interpretation before analyzing schedule, data, or cost impacts."},
    {k:"B", t:"Assume the directive applies, perform an integrated impact analysis immediately, and obtain legal confirmation during the formal change-control review."},
    {k:"C", t:"Keep the release date, add the directive to the risk register, and plan to produce the required audit evidence after go-live if the regulator requests it."},
    {k:"D", t:"Confirm applicability and interpretation with environmental, legal, technical, and operational specialists; then assess scope, data, cost, schedule, acceptance-evidence, and supplier impacts before updating plans and taking required decisions through governance."}
  ],
  answer:["D"],
  why:"The project manager should first establish what the directive requires and whether it applies, using qualified specialists, then assess integrated project impacts. Legal interpretation alone is necessary but not sufficient — implications also involve data architecture, operational evidence, suppliers, cost, schedule, acceptance, and governance.",
  notes:[
    "A: Reasonable as a first sub-step, but waiting for a final written legal interpretation before any other analysis can delay necessary integrated assessment.",
    "B: Impact analysis should be based on a confirmed or sufficiently clarified requirement, not an unverified assumption.",
    "C: The requirement is effective before release; knowingly deferring mandatory evidence creates avoidable noncompliance risk."
  ]
},
{
  id:5, caseId:2, meta:"Lesson 3 | People — Engage stakeholders | Adaptive | Single response",
  stem:"Rural clinicians and patient advocates report that the solution does not reflect transport constraints or varied digital literacy. What should the project manager do FIRST to improve engagement?",
  type:"single",
  options:[
    {k:"A", t:"Ask the product owner to synthesize the existing rural feedback into backlog items and continue the current engagement model to avoid delaying the pilot."},
    {k:"B", t:"Analyze the affected stakeholder groups and barriers, then tailor engagement by involving rural clinicians and patient representatives directly in discovery, review, and feedback cycles."},
    {k:"C", t:"Schedule a formal rural-user focus group after the next monthly release so the team can collect feedback from a larger completed increment."},
    {k:"D", t:"Ask the sponsor to add a rural-access KPI to the scorecard before changing the engagement approach, so the team has an objective target."}
  ],
  answer:["B"],
  why:"The evidence shows a representation and engagement gap. Direct participation from rural clinicians and patient representatives helps the team understand constraints that a generic report or intermediary may miss and strengthens the feedback loop needed for adaptive product decisions.",
  notes:[
    "A: Backlog refinement is useful, but summarizing current feedback through an intermediary does not correct the underlying engagement gap.",
    "C: A focus group may help later, but delaying direct engagement until after another release allows known outcome problems to persist.",
    "D: A KPI can support measurement, but the team needs stakeholder insight to understand what should be measured and changed."
  ]
},
{
  id:6, caseId:2, meta:"Lesson 4 | People — Help ensure knowledge transfer | Adaptive | Single response",
  stem:"The lead data scientist will leave in twelve working days, and important decision logic is undocumented. What should the project manager do FIRST?",
  type:"single",
  options:[
    {k:"A", t:"Immediately schedule daily pairing sessions between the data scientist and the replacement team, documenting knowledge gaps only as they appear during the sessions."},
    {k:"B", t:"Identify the critical knowledge, single-person dependencies, and highest-risk gaps first, then prioritize an accelerated transfer plan using pairing, recorded walkthroughs, decision logs, model documentation, repository updates, and multiple recipients."},
    {k:"C", t:"Require the departing specialist to complete all missing documentation before any pairing or demonstrations begin, so the transfer is based on approved artifacts."},
    {k:"D", t:"Prioritize recruitment of an equally senior replacement because knowledge transfer is most effective after the receiving specialist has been hired."}

  answer:["B"],
  why:"Before choosing transfer activities, the project manager should identify which knowledge is critical, where single-person dependencies exist, and what would create the greatest delivery or safety risk if lost. That prioritization makes the short transfer window effective.",
  notes:[

    "C: Documentation-only transfer misses tacit knowledge and delays interactive learning.",
    "D: Hiring may occur in parallel, but waiting for a replacement risks losing knowledge within twelve working days."
  ]
},
{
  id:7, caseId:2, meta:"Lessons 4 and 5 | Business Environment — Risk | Adaptive / AI-enabled | Multiple response — Select THREE",
  stem:"The AI risk tool rates harmful model bias as low because no serious incident occurred during a small pilot, although the rural sample is limited. Which THREE actions should the project manager take?",
  type:"multi", selectN:3,
  options:[
    {k:"A", t:"Accept the automated rating because a consistent algorithm is less subjective than individual expert judgment."},
    {k:"B", t:"Validate the data, assumptions, sample limitations, and confidence behind the rating with relevant analytics, clinical, privacy, and user representatives."},
    {k:"C", t:"Record and analyze bias, privacy, model-drift, and clinical-safety risks with owners, triggers, responses, thresholds, and evidence requirements."},
    {k:"D", t:"Remove AI from the project because a model that cannot prove equal performance for every subgroup should not support healthcare work."},
    {k:"E", t:"Use independent validation and stakeholder evidence to determine whether risk exposure is within approved thresholds before wider deployment."}
  ],
  answer:["B","C","E"],
  why:"The AI rating is based on incomplete evidence. The project manager should validate assumptions, maintain explicit risk information, and use independent evidence and approved thresholds before wider deployment. AI output is a decision input, not a substitute for accountable judgment.",
  notes:[
    "A: Automation can improve consistency, but the scenario explicitly shows missing context that makes the rating unreliable.",
    "D: Removing AI entirely is disproportionate; risks should be understood, treated, monitored, and governed unless exposure remains unacceptable."
  ]
},
{
  id:8, caseId:2, meta:"Lesson 3 | People — Manage stakeholder expectations | Adaptive / Hybrid governance | Single response",
  stem:"The operations director wants immediate wider release because waiting time improved, while privacy approval and equitable-access outcomes remain unresolved. How should the project manager manage the release expectation?",

const TESTS = {
  "mock-test-01": {
    id: "mock-test-01",
    title: "Mock Test 01",
    fullTitle: "PMP 2026 — Lengthy Scenario-Based Practice",
    subtitle: "Lessons 1 to 5 | 20 questions | Case studies + standalone scenarios | ~55-65 min",
    cases: CASES_MT01,
    questions: QUESTIONS_MT01
  }
};
const TEST_ORDER = ["mock-test-01"];

   file (visible in page source) — it is only meant to keep casual visitors out of
   the trainer tab, not to protect sensitive data. */
const TRAINER_PASSCODE = "trainer2026";

/* ============================================================
   STATE
   ============================================================ */
let state = {
  view: localStorage.getItem('pmp_portal_name') ? 'testList' : 'gate',
  studentName: localStorage.getItem('pmp_portal_name') || '',
  currentTestId: null,
  userAnswers: {},
  submitted: false,
  trainerAuthed: false
};

/* ============================================================
   NETLIFY FORMS SYNC (student -> trainer data capture)
   ============================================================ */
function encodeFormData(data){
  return Object.keys(data).map(k => encodeURIComponent(k) + "=" + encodeURIComponent(data[k])).join("&");
}
function sendResultToNetlify(fields){
  try{
    fetch("/", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: encodeFormData(Object.assign({ "form-name": "mock-test-results" }, fields))
    }).catch(()=>{ /* offline or local preview — ignore */ });
  }catch(e){ /* ignore */ }
}
function saveLocalAttempt(rec){
  const key = 'pmp_portal_attempts';
  const all = JSON.parse(localStorage.getItem(key) || '[]');
  all.push(rec);
  localStorage.setItem(key, JSON.stringify(all));
}
function getLocalAttempts(){
  return JSON.parse(localStorage.getItem('pmp_portal_attempts') || '[]');
}
function getBestLocalAttempt(testId, name){
  const all = getLocalAttempts().filter(a => a.test_id === testId && a.student_name.toLowerCase() === name.toLowerCase());
  if(all.length === 0) return null;
  return all[all.length - 1];
}

/* ============================================================
   RENDER / ROUTER
   ============================================================ */
function render(){
  const app = document.getElementById('app');
  const topbar = document.getElementById('topbar-row');
  const title = document.getElementById('page-title');
  const subtitle = document.getElementById('page-subtitle');

  if(state.view === 'gate'){
    title.textContent = 'PMP Prep Portal';
    subtitle.textContent = 'Scenario-based mock tests with instant grading and explanations';
    topbar.innerHTML = '';
    app.innerHTML = renderGate();
    return;
  }
  if(state.view === 'testList'){
    title.textContent = 'PMP Prep Portal';
    subtitle.textContent = 'Choose a mock test to begin';
    topbar.innerHTML = `<span>Signed in as <strong>${escapeHtml(state.studentName)}</strong></span><a onclick="changeName()">Not you? Change name</a>`;
    app.innerHTML = renderTestList();
    return;
  }
  if(state.view === 'quiz'){
    const test = TESTS[state.currentTestId];
    title.textContent = test.fullTitle;
    subtitle.textContent = test.subtitle;
    topbar.innerHTML = `<span>${escapeHtml(state.studentName)} · ${test.title}</span><a onclick="backToList()">Back to test list</a>`;
    app.innerHTML = renderQuizShell();
    renderQuizQuestions();
    return;
  }
  if(state.view === 'trainerLogin'){
    title.textContent = 'Trainer Login';
    subtitle.textContent = 'View student progress across all mock tests';
    topbar.innerHTML = `<a onclick="goGate()">Back to student view</a>`;
    app.innerHTML = renderTrainerLogin();
    return;
  }
  if(state.view === 'trainerView'){
    title.textContent = 'Trainer Dashboard';
    subtitle.textContent = 'Student progress across all mock tests';
    topbar.innerHTML = `<a onclick="goGate()">Exit trainer view</a>`;
    app.innerHTML = renderTrainerView();
    return;
  }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- Gate (name entry / role choice) ---------- */
function renderGate(){
  return `
  <div class="center-card">
    <h2>Welcome</h2>
    <p>Enter your name to access the mock tests.</p>
    <input type="text" id="name-input" placeholder="Your full name" value="${escapeHtml(state.studentName)}" onkeydown="if(event.key==='Enter') submitName()">
    <div class="role-row">
      <button class="btn-primary" onclick="submitName()">Continue as Student</button>
    </div>
    <div class="trainer-link">
      Are you the trainer? <button onclick="goTrainerLogin()">Trainer login</button>
    </div>
  </div>`;
}
function submitName(){
  const val = document.getElementById('name-input').value.trim();
  if(!val){ alert('Please enter your name to continue.'); return; }
  state.studentName = val;
  localStorage.setItem('pmp_portal_name', val);
  state.view = 'testList';
  render();
}
function changeName(){
  localStorage.removeItem('pmp_portal_name');
  state.studentName = '';
  state.view = 'gate';
  render();
}
function goGate(){
  state.view = state.studentName ? 'testList' : 'gate';
  state.trainerAuthed = false;
  render();
}

/* ---------- Test list (student) ---------- */
function renderTestList(){
  let cards = TEST_ORDER.map(id => {
    const t = TESTS[id];
    const best = getBestLocalAttempt(id, state.studentName);
    const badge = best ? `<div class="attempt-badge">Last attempt on this device: ${best.score}/${best.total} (${best.percent}%)</div>` : '';
    return `<div class="test-card">
      <div>
        <h3>${escapeHtml(t.title)}</h3>
        <p>${escapeHtml(t.subtitle)}</p>
        ${badge}
      </div>
      <button class="btn-primary" onclick="startTest('${id}')">Start test</button>
    </div>`;
  }).join('');

  return `
    <div class="test-list-header"><h2>Available mock tests</h2></div>
    ${cards}
    <div class="coming-soon">More mock tests will appear here as they're added to the portal.</div>
  `;
}

        <li>Use only the facts given in each passage — don't assume authority or information that isn't stated.</li>
        <li>When two options look reasonable, ask: what should the project manager do FIRST or NEXT?</li>
        <li>You'll get instant right/wrong feedback and a full explanation for every question after you submit.</li>
        <li>Your name and score are recorded for your trainer once you submit.</li>
      </ul>
      <div style="text-align:center;margin-top:20px;">
        <button class="btn-primary" onclick="beginQuiz()">Start the test</button>
      </div>
    </div>

    <div id="progress-bar-outer" class="hidden">
      <div id="progress-bar-track"><div id="progress-bar-fill"></div></div>
      <div id="progress-label">0 answered</div>
    </div>

    <div id="score-card" class="hidden"></div>

    <form id="quiz-form" class="hidden"></form>

    <div id="submit-row" class="hidden">
      <button id="submit-btn" class="btn-primary" onclick="submitTest()">Submit test</button>
      <div style="margin-top:10px;font-size:.82rem;color:var(--gray);" id="submit-hint"></div>
    </div>

    <div id="retry-row" class="hidden" style="text-align:center;margin:20px 0 60px;">
      <button class="btn-secondary" onclick="backToList()">Back to test list</button>
    </div>
  `;
}

function startTest(testId){
  state.currentTestId = testId;
  state.userAnswers = {};
  state.submitted = false;
  state.view = 'quiz';
  render();
}
function backToList(){
  state.view = 'testList';
  state.currentTestId = null;
  render();
}
function beginQuiz(){
  document.getElementById('intro').classList.add('hidden');
  document.getElementById('progress-bar-outer').classList.remove('hidden');
  document.getElementById('quiz-form').classList.remove('hidden');
  document.getElementById('submit-row').classList.remove('hidden');
}

function renderChart(q){
  if(!q.chart) return '';
  if(q.chart.bars){
    let rows = q.chart.bars.map(b=>{
      return `<div class="bar-row"><div class="bar-label">${b.label}</div><div class="bar-track"><div class="bar-fill" style="width:${b.pct}%">${b.pct}%</div></div><div class="bar-n">n=${b.n}</div></div>`;
    }).join('');
    return `<div class="chart-box"><div class="chart-title">${q.chart.title}</div>${rows}<div class="target-note">Dashed target line at ${q.chart.target}% technical target</div></div>`;
  }
  if(q.chart.evm){
    const e = q.chart.evm;
    const maxv = e.bac;
    const bar = (label,val)=>`<div class="bar-row"><div class="bar-label">${label}</div><div class="bar-track"><div class="bar-fill" style="width:${(val/maxv*100).toFixed(0)}%">$${val.toFixed(1)}M</div></div></div>`;
    return `<div class="chart-box"><div class="chart-title">${q.chart.title}</div>${bar('Planned Value (PV)',e.pv)}${bar('Earned Value (EV)',e.ev)}${bar('Actual Cost (AC)',e.ac)}<div class="target-note">BAC = $${e.bac.toFixed(1)}M</div></div>`;
  }
  if(q.chart.dashboard){
    let rows = q.chart.dashboard.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('');
    return `<div class="chart-box"><div class="chart-title">${q.chart.title}</div>
      <table class="dash"><tr><th>Indicator</th><th>Displayed status</th><th>Source / freshness</th><th>Confidence</th></tr>${rows}</table></div>`;
  }
  return '';
}

function renderQuizQuestions(){
  const test = TESTS[state.currentTestId];
  const QUESTIONS = test.questions;
  const CASES = test.cases;
  const form = document.getElementById('quiz-form');
  let html = '';
  let lastCase = null;
  QUESTIONS.forEach(q=>{
    if(q.caseId && q.caseId !== lastCase){
      const c = CASES[q.caseId];
      html += `<div class="case-banner"><h3>${c.title}</h3><div style="font-size:.82rem;color:var(--gray);margin-bottom:8px;">${c.subtitle}</div><p>${c.passage}</p></div>`;
      lastCase = q.caseId;
    }
    html += `<div class="q-card" id="qcard-${q.id}">
      <div class="q-meta"><span class="q-num">Question ${q.id}</span> &nbsp;|&nbsp; ${q.meta}</div>`;
    if(q.passage){
      html += `<p style="font-size:.92rem;color:#2b3948;margin-bottom:12px;">${q.passage}</p>`;
    }
    html += renderChart(q);
    html += `<p class="q-stem">${q.stem}</p>`;
    if(q.type==='multi'){
      html += `<div class="select-hint">Select exactly ${q.selectN} options.</div>`;
    }
    q.options.forEach(opt=>{
      const inputType = q.type==='multi' ? 'checkbox' : 'radio';
      const name = q.type==='multi' ? `q${q.id}_${opt.k}` : `q${q.id}`;
      html += `<div class="option" id="opt-${q.id}-${opt.k}" data-q="${q.id}" data-k="${opt.k}">
        <input type="${inputType}" name="${name}" value="${opt.k}" id="in-${q.id}-${opt.k}" onchange="handleChange(${q.id})">
        <label for="in-${q.id}-${opt.k}"><strong>${opt.k}.</strong> ${opt.t}</label>
      </div>`;
    });
    html += `<div class="explanation" id="exp-${q.id}">
      <h4>Correct answer: ${q.answer.join(', ')}</h4>
      <p class="why-best">${q.why}</p>
      ${q.notes.map(n=>`<p class="rationale-line">${n}</p>`).join('')}
    </div>`;
    html += `</div>`;
  });
  form.innerHTML = html;
  updateProgress();
}

function handleChange(qid){
  const test = TESTS[state.currentTestId];
  const q = test.questions.find(x=>x.id===qid);
  if(q.type==='multi'){
    const checked = Array.from(document.querySelectorAll(`input[id^="in-${qid}-"]:checked`)).map(el=>el.value);
    if(checked.length > q.selectN){
      alert(`You can select at most ${q.selectN} options for this question.`);
      event.target.checked = false;
      return;
    }
    state.userAnswers[qid] = checked;
  } else {
    const checked = document.querySelector(`input[name="q${qid}"]:checked`);
    state.userAnswers[qid] = checked ? [checked.value] : [];
  }
  updateProgress();
}

function updateProgress(){
  const test = TESTS[state.currentTestId];
  const QUESTIONS = test.questions;
  let answered = 0;
  QUESTIONS.forEach(q=>{
    const ua = state.userAnswers[q.id] || [];
    if(q.type==='multi'){
      if(ua.length === q.selectN) answered++;
    } else {
      if(ua.length === 1) answered++;
    }
  });
  const pct = (answered/QUESTIONS.length*100).toFixed(0);
  document.getElementById('progress-bar-fill').style.width = pct+'%';
  document.getElementById('progress-label').textContent = `${answered} / ${QUESTIONS.length} answered`;
  const hint = document.getElementById('submit-hint');
  if(answered === QUESTIONS.length){
    hint.textContent = 'All questions answered — ready to submit.';
  } else {
    hint.textContent = `${QUESTIONS.length - answered} question(s) still unanswered. You can submit anyway — unanswered items count as incorrect.`;
  }
}

function arraysEqual(a,b){
  if(a.length!==b.length) return false;
  const as=[...a].sort(), bs=[...b].sort();
  return as.every((v,i)=>v===bs[i]);
}

function submitTest(){
  state.submitted = true;
  const test = TESTS[state.currentTestId];
  const QUESTIONS = test.questions;
  let correctCount = 0;
  const domainScore = {People:[0,0],Process:[0,0],"Business Environment":[0,0]};

  QUESTIONS.forEach(q=>{
    const ua = state.userAnswers[q.id] || [];
    const isCorrect = arraysEqual(ua, q.answer);
    if(isCorrect) correctCount++;

    let dom = q.meta.includes('People') ? 'People' : q.meta.includes('Process') ? 'Process' : 'Business Environment';
    domainScore[dom][1]++;
    if(isCorrect) domainScore[dom][0]++;

    q.options.forEach(opt=>{
      const el = document.getElementById(`opt-${q.id}-${opt.k}`);
      const wasPicked = ua.includes(opt.k);
      const isRight = q.answer.includes(opt.k);
      document.getElementById(`in-${q.id}-${opt.k}`).disabled = true;
      if(isRight && wasPicked){
        el.classList.add('correct');
      } else if(!isRight && wasPicked){
        el.classList.add('incorrect');
      } else if(isRight && !wasPicked){
        el.classList.add('was-correct-not-picked');
      }
    });

    const card = document.getElementById(`qcard-${q.id}`);
    const stem = card.querySelector('.q-stem');
    const tag = document.createElement('span');
    tag.className = 'result-tag ' + (isCorrect ? 'tag-right' : 'tag-wrong');
    tag.textContent = isCorrect ? 'Correct' : 'Incorrect';
    stem.appendChild(tag);
    if(ua.length===0){
      const flag = document.createElement('span');
      flag.className = 'unanswered-flag';
      flag.textContent = '(not answered)';
      stem.appendChild(flag);
    }
    document.getElementById(`exp-${q.id}`).classList.add('show');
  });

  document.getElementById('submit-row').classList.add('hidden');
  document.getElementById('retry-row').classList.remove('hidden');

  const pct = Math.round(correctCount/QUESTIONS.length*100);
  const scoreCard = document.getElementById('score-card');
  scoreCard.classList.remove('hidden');
  scoreCard.innerHTML = `
    <h2>Your Score</h2>
    <div id="score-big">${correctCount} / ${QUESTIONS.length}</div>
    <div id="score-sub">${pct}% correct — recorded for ${escapeHtml(state.studentName)}</div>
    <div class="domain-breakdown">
      ${Object.keys(domainScore).map(d=>`<div class="domain-pill"><strong>${d}:</strong> ${domainScore[d][0]}/${domainScore[d][1]}</div>`).join('')}
    </div>`;
  if(typeof scoreCard.scrollIntoView === 'function'){ scoreCard.scrollIntoView({behavior:'smooth'}); }

  // Record the attempt: locally (for this device's "last attempt" badge / trainer fallback view)
  // and to Netlify Forms (so the trainer can see it from the site's Forms dashboard, any device).
  const record = {
    test_id: test.id,
    test_title: test.title,
    student_name: state.studentName,
    score: correctCount,
    total: QUESTIONS.length,
    percent: pct,
    domain_people: `${domainScore.People[0]}/${domainScore.People[1]}`,
    domain_process: `${domainScore.Process[0]}/${domainScore.Process[1]}`,
    domain_business: `${domainScore["Business Environment"][0]}/${domainScore["Business Environment"][1]}`,
    timestamp: new Date().toISOString(),
    answers_json: JSON.stringify(state.userAnswers)
  };
  saveLocalAttempt(record);
  sendResultToNetlify(record);
}

/* ---------- Trainer views ---------- */
function goTrainerLogin(){
  state.view = 'trainerLogin';
  render();
}
function renderTrainerLogin(){
  return `
  <div class="center-card">
    <h2>Trainer Login</h2>
    <p>Enter the trainer passcode to view student progress.</p>
    <input type="password" id="passcode-input" placeholder="Passcode" onkeydown="if(event.key==='Enter') submitPasscode()">
    <div class="role-row">
      <button class="btn-primary" onclick="submitPasscode()">Enter</button>
    </div>
  </div>`;
}
function submitPasscode(){
  const val = document.getElementById('passcode-input').value;
  if(val !== TRAINER_PASSCODE){
    alert('Incorrect passcode.');
    return;
  }
  state.trainerAuthed = true;
  state.view = 'trainerView';
  render();
}
function renderTrainerView(){
  const netlifySiteId = "d7700b24-07fc-4404-930e-aebf82e45707";
  const formsUrl = `https://app.netlify.com/projects/pmpmockexamsanjeewani/forms`;

  const local = getLocalAttempts().slice().reverse();
  let rows = local.map(a => `<tr>
      <td>${escapeHtml(a.student_name)}</td>

      <td>${a.score}/${a.total} (${a.percent}%)</td>

  return `
  <div class="trainer-card">
    <h3>Live results — all students, all devices</h3>
    <p>Every submitted test is sent to this site's Netlify Forms inbox, regardless of which device the student used. Open the dashboard to see every student's name, score, and timestamp, and export to CSV.</p>
    <a class="dashboard-link" href="${formsUrl}" target="_blank" rel="noopener">Open results dashboard ↗</a>
  </div>

  <div class="trainer-card">
    <h3>This device's history</h3>
    <p>A convenience copy of attempts submitted from this specific browser (e.g. if students take the test on a shared/kiosk device). It will not show attempts made on other devices — use the dashboard above for the full picture.</p>
    <table class="local-table">
      <tr><th>Name</th><th>Test</th><th>Score</th><th>People</th><th>Process</th><th>Bus. Env.</th><th>Submitted</th></tr>
      ${rows}
    </table>
  </div>

  <div class="note-box">The trainer passcode is stored in this file's source code as a convenience gate — it is not secure against someone determined to view the page source. Don't use it to protect sensitive information.</div>
  `;
}

render();
