<!-- ── LocalStorage-based storage (replaces Claude artifact storage) ── -->
<script>
window.storage = {
  set: function(key, value, shared) {
    try {
      var prefix = shared ? 'shared_' : 'private_';
      localStorage.setItem(prefix + key, value);
      return Promise.resolve({ key: key, value: value, shared: !!shared });
    } catch(e) {
      return Promise.reject(e);
    }
  },
  get: function(key, shared) {
    try {
      var prefix = shared ? 'shared_' : 'private_';
      var v = localStorage.getItem(prefix + key);
      if (v === null) return Promise.reject(new Error('Key not found: ' + key));
      return Promise.resolve({ key: key, value: v, shared: !!shared });
    } catch(e) {
      return Promise.reject(e);
    }
  },
  delete: function(key, shared) {
    try {
      var prefix = shared ? 'shared_' : 'private_';
      localStorage.removeItem(prefix + key);
      return Promise.resolve({ key: key, deleted: true, shared: !!shared });
    } catch(e) {
      return Promise.reject(e);
    }
  },
  list: function(prefix, shared) {
    try {
      var storePrefix = shared ? 'shared_' : 'private_';
      var keys = [];
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && k.startsWith(storePrefix + (prefix || ''))) {
          keys.push(k.substring(storePrefix.length));
        }
      }
      return Promise.resolve({ keys: keys, prefix: prefix, shared: !!shared });
    } catch(e) {
      return Promise.reject(e);
    }
  }
};
</script>

const PAPERS = {
  1: {
    title: "Mock Exam — Paper 1",
    subtitle: "PMP Fundamentals · People Domain · Process Domain Part 1",
    color: "#0F2557",
    accent: "#0D9488",
    questions: [
      { id:1, section:"PMP Fundamentals", diff:"Easy", q:"A project manager has been assigned to build a new mobile payment platform for a bank. The project has a defined start date, a budget of $2 million, and must be completed within 12 months. The team has not built this type of system before. Which characteristic BEST identifies this as a project rather than an operation?", opts:["It has a defined budget and timeline","It produces a unique outcome and is temporary in nature","It requires a project manager to oversee it","It involves multiple stakeholders and complex dependencies"], correct:1, explanation:"Projects are temporary endeavours producing unique outcomes. Temporary + unique = the defining characteristics. Budget and timeline alone do not distinguish projects from operations." },
      { id:2, section:"PMP Fundamentals", diff:"Medium", q:"A company runs an annual performance review process that repeats every year with the same steps, the same team, and the same outputs. The HR director asks the PM to 'manage' this as a project each year. Is this correct, and why?", opts:["Yes — any planned work managed by a PM is a project","No — it is an operation; it is repetitive, ongoing, and produces no unique outcomes","Yes — it has a start and end date each year which makes it temporary","No — it should be managed as a programme since it repeats annually"], correct:1, explanation:"Operations are ongoing, repetitive activities sustaining the organisation. The annual review repeats with the same process and outputs — it is an operation, not a project." },
      { id:3, section:"PMI Talent Triangle", diff:"Medium", q:"A newly certified PMP is advising a client on restructuring their project governance framework. She draws on her knowledge of organisational dynamics, stakeholder engagement, and change management. According to the PMI Talent Triangle 2022, which skill area is she demonstrating?", opts:["Ways of Working","Power Skills","Business Acumen","Technical Project Management"], correct:1, explanation:"Power Skills (formerly Leadership) covers interpersonal skills, stakeholder engagement, change management, and influencing." },
      { id:4, section:"6 Constraints", diff:"Easy", q:"A project manager is managing the construction of a hospital wing. The project is 70% complete. The sponsor requests a 20% reduction in scope to bring the project under budget. Which constraint is the sponsor asking the PM to modify?", opts:["Schedule","Quality","Risk","Scope"], correct:3, explanation:"The sponsor is asking to reduce SCOPE to address the cost issue. Changing one constraint affects others." },
      { id:5, section:"6 Constraints", diff:"Hard", q:"During project execution, the customer requests an additional feature not in the original scope. The PM analyses the impact: +2 weeks to schedule, +$50,000 to budget, quality unaffected. The sponsor approves the change. Which statement BEST describes this scenario?", opts:["The PM failed by allowing scope creep to occur","The PM successfully managed a scope change by assessing and documenting all constraint impacts before approval","The PM should have refused the request since it changes the original plan","The customer's request should be handled informally since the sponsor has approved it verbally"], correct:1, explanation:"Approved scope changes that assess all constraint impacts are GOOD project management — not scope creep. Scope creep is UNAPPROVED change." },
      { id:6, section:"Role of the PM", diff:"Medium", q:"A project manager notices a team member has skills that are not being utilised. She reassigns them to a critical path activity that aligns with their skills, improving efficiency. Which PM role is she demonstrating?", opts:["Risk Manager","Sponsor Liaison","Resource Optimiser and Leader","Change Control Authority"], correct:2, explanation:"The PM's role includes optimising resources and leading people. Identifying underutilised talent and realigning assignments is a core PM leadership and resource management responsibility." },
      { id:7, section:"PMI Talent Triangle", diff:"Medium", q:"A project manager presents quarterly results to the Board of Directors. She connects project metrics to the organisation's strategic goals, explains how the project ROI justifies continued investment, and provides a competitive analysis. Which skill area from the PMI Talent Triangle 2022 is she applying?", opts:["Power Skills","Ways of Working","Business Acumen","Technical Project Management"], correct:2, explanation:"Business Acumen involves understanding the organisation's strategy, connecting project outcomes to business value, and financial literacy." },
      { id:8, section:"PMP Fundamentals", diff:"Hard", q:"A PM manages three concurrent projects. A portfolio manager oversees 12 projects and programmes. A programme manager coordinates four related projects delivering a new logistics platform. Which statement correctly describes the relationship?", opts:["Programme and portfolio managers have the same responsibilities","PM manages individual projects; programme manager coordinates related projects for strategic benefit; portfolio manager oversees all investments for strategic alignment","The portfolio manager must approve every change the PM makes","Portfolio management focuses on day-to-day delivery while programme management focuses on strategy"], correct:1, explanation:"PM = individual projects. Programme manager = coordinating related projects for combined benefits. Portfolio manager = strategic oversight of all programmes, projects, and operations." },
      { id:9, section:"People Domain", diff:"Medium", q:"Two senior developers argue about technical approach for a critical module. The PM facilitates a structured discussion where both present evidence-based arguments and the team evaluates both approaches collaboratively before making a joint decision. Which conflict resolution technique is the PM using?", opts:["Compromising","Smoothing","Collaborate/Problem-Solve","Forcing"], correct:2, explanation:"Collaborate/Problem-Solve involves addressing the conflict directly, gathering facts from both sides, and working to a mutually acceptable solution. It is the PMI-preferred FIRST approach." },
      { id:10, section:"People Domain", diff:"Easy", q:"A project manager has limited time before a major delivery milestone. She acknowledges a disagreement between two team members, asks both parties to set it aside temporarily, and schedules a structured resolution session for the following week. Which conflict resolution technique is she using?", opts:["Forcing","Withdraw/Avoid","Smooth/Accommodate","Compromise"], correct:1, explanation:"Withdraw/Avoid is deliberately postponing a conflict for a later time. It is NOT always wrong, but it is PMI's LAST preferred choice in most situations." },
      { id:11, section:"Leadership Styles", diff:"Medium", q:"A project manager leads a high-performing, experienced agile team. The team has worked together for two years and consistently delivers above expectations. The PM provides general direction and trusts the team without micromanaging. Which leadership style BEST describes this approach?", opts:["Directing (Telling)","Delegating","Coaching","Transactional"], correct:1, explanation:"Delegating is appropriate for experienced, high-performing teams who need minimal oversight. Situational leadership matches style to team maturity." },
      { id:12, section:"Motivation Theories", diff:"Medium", q:"A PM notices team members are satisfied with their salaries but still seem disengaged. She implements a recognition programme, assigns more challenging work, and creates advancement opportunities. According to Herzberg's Two-Factor Theory, which category of factors is she applying?", opts:["Hygiene factors — addressing basic needs","Motivators — providing growth, recognition, and achievement","Theory Y — assuming people are self-motivated","Expectancy factors — increasing the value of rewards"], correct:1, explanation:"Herzberg: Hygiene factors (salary) prevent dissatisfaction but do NOT motivate. MOTIVATORS (recognition, growth, achievement, challenging work) create positive motivation." },
      { id:13, section:"Motivation Theories", diff:"Hard", q:"A colleague's management philosophy: 'He believes team members are fundamentally lazy and will avoid work if they can. He monitors attendance closely, sets rigid procedures, and relies on penalties for poor performance.' Which motivation theory does this reflect?", opts:["Theory Y — a positive assumption about worker motivation","Maslow's Hierarchy — meeting basic safety and security needs","Theory X — a negative assumption that workers must be controlled","McClelland's Theory — driven by need for power"], correct:2, explanation:"McGregor's Theory X assumes workers are lazy, avoid responsibility, and must be directed and controlled. Theory Y assumes workers are self-motivated and can be trusted." },
      { id:14, section:"Tuckman's Stages", diff:"Medium", q:"A new cross-functional project team has just been assembled. In the first week, members are polite and cautious, learning about each other's backgrounds and the project goals. There is little conflict and everyone is on their best behaviour. In which stage of Tuckman's Team Development model is this team?", opts:["Norming","Storming","Performing","Forming"], correct:3, explanation:"Forming: team members meet, establish relationships, and understand goals. Behaviour is polite, cautious, and exploratory. The team is not yet productive." },
      { id:15, section:"Tuckman's Stages", diff:"Medium", q:"Three months into a project, two team members have established a great workflow ahead of schedule. However, a third member consistently submits work late and the team is frustrated. They establish ground rules about deadlines. Which Tuckman stage BEST describes this team?", opts:["Forming","Storming","Norming","Adjourning"], correct:2, explanation:"Norming: team establishes working agreements, norms, and procedures. Conflict from Storming is being resolved. The team is developing cohesion." },
      { id:16, section:"Servant Leadership", diff:"Hard", q:"A PM notices her team's velocity has dropped. She discovers a key team member is blocked waiting for a security review from another department. Rather than asking the team member to keep waiting, she personally schedules a meeting with the security department head and clears the impediment. Which leadership characteristic is she demonstrating?", opts:["Authoritative leadership — using her authority to force resolution","Servant leadership — removing impediments to enable the team to deliver","Transactional leadership — exchanging favours for performance","Laissez-faire — giving the team freedom to solve their own problems"], correct:1, explanation:"Servant leadership prioritises the needs of the team. Removing impediments — proactively eliminating obstacles that block team productivity — is the PRIMARY servant leadership behaviour." },
      { id:17, section:"Stakeholder Management", diff:"Medium", q:"A PM identifies a stakeholder with HIGH influence over the project budget but LOW interest in day-to-day activities. The stakeholder could block project funding if dissatisfied. On the Power/Interest Grid, where should this stakeholder be placed?", opts:["Low power, high interest — Keep Informed","High power, high interest — Manage Closely","High power, low interest — Keep Satisfied","Low power, low interest — Monitor"], correct:2, explanation:"High power + Low interest = Keep Satisfied. These stakeholders can block your project but don't want details. Engage at a strategic level and address their concerns proactively." },
      { id:18, section:"People Domain", diff:"Hard", q:"A PM leads a virtual team across Sri Lanka, India, and Singapore. Sri Lankan team members are reluctant to openly disagree with suggestions from senior colleagues in Singapore, even when they have valid concerns. What should the PM do FIRST?", opts:["Ignore cultural differences — people should adapt to professional standards","Establish team ground rules that explicitly create psychological safety for all team members to raise concerns without fear of hierarchy-based reprisal","Replace Sri Lankan team members with people who communicate more assertively","Report the Singapore team for creating an intimidating environment"], correct:1, explanation:"The PM's role in virtual/multicultural teams is to create psychological safety and explicit communication norms. Establishing ground rules that make concern-raising safe is the first proactive step." },
      { id:19, section:"Emotional Intelligence", diff:"Medium", q:"During a project status meeting, the PM notices that a usually confident team lead seems withdrawn and gives unusually short answers. After the meeting, the PM privately asks if everything is okay. The team lead shares they are overwhelmed with competing demands. The PM adjusts the workload and offers support. Which dimension of EI is the PM primarily demonstrating?", opts:["Self-awareness","Self-regulation","Empathy","Motivation"], correct:2, explanation:"Empathy is recognising and understanding the emotional states of others and responding appropriately. The PM noticed the non-verbal cues and proactively addressed the team lead's situation." },
      { id:20, section:"People Domain", diff:"Hard", q:"A project is experiencing performance issues. A team member consistently misses deadlines, produces below-standard work, and has been coached twice with no improvement. What should the PM do next?", opts:["Immediately remove the team member from the project","Document the performance issues formally, follow the organisation's HR process, and discuss consequences if performance does not improve within a defined timeframe","Give the team member more time — performance issues always resolve themselves","Assign all their work to other team members without addressing the issue"], correct:1, explanation:"PMI expects PMs to follow due process: document, coach, provide formal feedback, and follow HR procedures. Immediate removal without process is inappropriate." },
      { id:21, section:"5 Process Groups", diff:"Easy", q:"A PM has just received approval to proceed with a new software project. Her next step is to formally authorise the project, identify the project manager, and document high-level scope, schedule, and budget. Which Process Group is she working in?", opts:["Planning","Executing","Initiating","Monitoring & Controlling"], correct:2, explanation:"Initiating is where the project is formally authorised. Key outputs include the Project Charter and Stakeholder Register. The PM is also formally appointed during this phase." },
      { id:22, section:"Project Charter", diff:"Medium", q:"The IT Director verbally tells a PM to 'start building the new HR system.' The PM begins assigning resources and initiating development without any written authorisation. Two months later, the project is cancelled by the Finance department, which was never informed. What was the PRIMARY mistake?", opts:["The PM should have built the system faster before the Finance team noticed","No Project Charter was created — the project lacked formal authorisation, visibility, and executive commitment","The IT Director should have had more authority","The Finance department should not have had cancellation authority"], correct:1, explanation:"The Project Charter formally authorises the project and grants the PM authority. Without it, the project lacks visibility, commitment, and stakeholder alignment." },
      { id:23, section:"Project Charter", diff:"Medium", q:"Who is PRIMARILY responsible for creating and signing the Project Charter?", opts:["The Project Manager — they have the most detailed knowledge","The Project Sponsor — they authorise the project and provide funding","The PMO — they own all project governance documents","The Steering Committee — collective approval is required"], correct:1, explanation:"The PROJECT SPONSOR creates and signs the Project Charter. The PM may assist in drafting it but is NOT the author. The sponsor's signature provides the official authorisation." },
      { id:24, section:"Stakeholder Identification", diff:"Medium", q:"Sponser has completed the Project Charter and PM is now identifying all parties who may affect or be affected by the project. She is documenting their interests, influence, involvement, and potential impact. What is the primary output of this process?", opts:["Risk Register","Stakeholder Register","Communications Management Plan","Project Management Plan"], correct:1, explanation:"Identify Stakeholders produces the STAKEHOLDER REGISTER — listing all stakeholders, their contact information, roles, interests, influence, and engagement classification." },
      { id:25, section:"Stakeholder Identification", diff:"Hard", q:"A PM identifies 50 stakeholders for a government digital ID system. The minister has enormous political power but delegated all technical decisions to his deputy. A community group has low formal authority but could generate significant public opposition. How should the PM approach each?", opts:["Both stakeholders are equal — treat them the same way","The minister: Keep Satisfied (high power, low interest in technical detail). The community group: Keep Informed — their concern could create reputational risk","The minister should be actively managed daily. The community group should be ignored until launch","Both should be placed in the Manage Closely quadrant"], correct:1, explanation:"High power/low interest = Keep Satisfied with strategic updates. The community group has low formal power but high reputational impact — Keep Informed proactively." },
      { id:26, section:"Planning Process Group", diff:"Easy", q:"A PM has completed Initiating and is now developing the scope statement, WBS, schedule, budget, risk register, and communications plan. Which Process Group is she working in?", opts:["Initiating","Planning","Executing","Closing"], correct:1, explanation:"Planning is where all subsidiary management plans are created. It is the most process-rich group with 24 processes across 10 knowledge areas." },
      { id:27, section:"Scope Management", diff:"Medium", q:"A PM is defining the boundary of the project — what is included and what is explicitly excluded. She documents deliverables, acceptance criteria, constraints, and assumptions in detail. What document is she creating?", opts:["Project Charter","Scope Management Plan","Project Scope Statement","Work Breakdown Structure"], correct:2, explanation:"The PROJECT SCOPE STATEMENT defines what is included and excluded from the project. It documents deliverables, acceptance criteria, assumptions, and constraints." },
      { id:28, section:"WBS", diff:"Medium", q:"A PM decomposes the project scope into smaller, more manageable components. She stops decomposing when she reaches work packages — the lowest level. What fundamental rule governs a correct WBS?", opts:["The WBS must have exactly five levels of decomposition","The 100% Rule — the WBS must capture 100% of the project work, no more and no less","The WBS must be organised by time in chronological order","Each work package must take no more than 8 hours to complete"], correct:1, explanation:"The 100% Rule: the WBS must include ALL work in the project scope — nothing more, nothing less. Missing work means unplanned effort. Extra work means out-of-scope tasks consuming budget." },
      { id:29, section:"WBS", diff:"Hard", q:"During a project review, an auditor finds that significant integration testing is not in the WBS. Additionally, 'Stakeholder Training' in the WBS was never part of the agreed scope. What are the issues?", opts:["The WBS is too detailed — this is normal variation","Two violations of the 100% Rule: missing work (integration testing not in WBS) and extra work (training not in scope). Both indicate scope control failures","Only the missing integration testing is a problem — extra deliverables are acceptable","The WBS is a living document and can be changed freely during execution"], correct:1, explanation:"Both are 100% Rule violations. Missing work = scope gap. Extra deliverable not in scope = unauthorised scope addition. Both must go through formal change control." },
      { id:30, section:"Schedule Management", diff:"Medium", q:"Activity B can only start after Activity A finishes. Activity D can start after Activity B STARTS (not after it finishes). Activities C and E can both begin once Activity A finishes. Which scheduling concept does Activity B-to-D represent?", opts:["Finish-to-Start (FS) — B must finish before D starts","Start-to-Start (SS) — D can start when B starts","Finish-to-Finish (FF) — both must finish together","Start-to-Finish (SF) — B starts when D finishes"], correct:1, explanation:"Start-to-Start (SS): the successor can START when the predecessor STARTS. D can start once B has started — they run in parallel from B's start point." },
      { id:31, section:"Critical Path Method", diff:"Medium", q:"A project network has four paths: Path 1 = 18 days, Path 2 = 24 days, Path 3 = 21 days, Path 4 = 24 days. What is the project duration, which path(s) are critical, and what is the float on Path 1?", opts:["Project duration = 21 days. Path 3 is critical. Float on Path 1 = 3 days","Project duration = 24 days. Paths 2 and 4 are critical. Float on Path 1 = 6 days","Project duration = 18 days. Path 1 is critical. Paths 2, 3, and 4 have negative float","Project duration = 24 days. Only Path 2 is critical since it appeared first"], correct:1, explanation:"Project duration = the LONGEST path = 24 days. Paths 2 AND 4 are both critical (both = 24 days). Float on Path 1 = 24 - 18 = 6 days." },
      { id:32, section:"Critical Path Method", diff:"Hard", q:"Activity X: ES=10, EF=16, LS=14, LF=20, Duration=6. What is the Total Float for Activity X, and is it on the critical path?", opts:["Total Float = 6 days. Yes, it is on the critical path","Total Float = 4 days. No, it is NOT on the critical path","Total Float = 0 days. Yes, it is on the critical path","Total Float = 4 days. It depends on the project duration"], correct:1, explanation:"Total Float = LS - ES = 14 - 10 = 4 days (or LF - EF = 20 - 16 = 4). Float > 0 means X is NOT on the critical path." },
      { id:33, section:"Schedule Compression", diff:"Medium", q:"The sponsor asks the PM to reduce the schedule by 3 weeks. Option A: add 5 developers to coding on the critical path at $60,000. Option B: overlap testing with the last 3 weeks of coding by having the test team begin writing test cases while coding continues. Which techniques are Options A and B?", opts:["Option A = Fast Tracking. Option B = Crashing","Option A = Crashing. Option B = Fast Tracking","Both are crashing — just different types","Option A = Resource levelling. Option B = Schedule compression"], correct:1, explanation:"CRASHING = adding resources to shorten duration (costs more money). FAST TRACKING = overlapping activities that were originally sequential (increases risk)." },
      { id:34, section:"Schedule Compression", diff:"Hard", q:"A PM needs to recover 2 days. Activity P: crash from 10 to 8 days for $20,000 ($10,000/day). Activity Q: crash from 15 to 12 days for $15,000 ($5,000/day). Which activity should she crash FIRST to recover 2 days at LOWEST cost?", opts:["Activity P — crash it first because it saves more total time (2 days)","Activity Q — crash it first because it costs less per day ($5,000/day vs $10,000/day)","Both activities should be crashed simultaneously","Neither — the PM should use fast tracking since it is cheaper"], correct:1, explanation:"Crash cost per day: P = $10,000/day. Q = $5,000/day. Always crash the activity with the LOWEST cost per day first." },
      { id:35, section:"WBS", diff:"Medium", q:"A PM creates a WBS. The lowest level under Development shows specific screens to build. What is this lowest level called, and what can be done with it?", opts:["Control accounts — they can be assigned budgets for cost tracking","Work packages — they can be scheduled, estimated, monitored, and assigned to a team member","Decomposed tasks — they can only be used for resource planning","Milestones — they mark the completion of significant deliverables"], correct:1, explanation:"WORK PACKAGES are the lowest level of the WBS. They are small enough to schedule, estimate, monitor, and assign. They feed directly into the activity list for schedule development." },
      { id:36, section:"5 Process Groups", diff:"Medium", q:"A PM is comparing actual project performance against the baseline, identifying variances, and taking corrective actions. He updates the schedule, requests changes through the change control process, and reports status. Which Process Group BEST describes these activities?", opts:["Planning — updating plans is a planning activity","Executing — the team is still doing work","Monitoring & Controlling — tracking, reviewing, and regulating progress","Closing — preparing final status reports"], correct:2, explanation:"Monitoring & Controlling involves measuring performance against baselines, identifying variances, and initiating corrective or preventive actions." },
      { id:37, section:"Scope Management", diff:"Hard", q:"The QA team has verified all deliverables meet quality specifications (passed QC checks). The PM schedules a formal acceptance meeting with the customer, who accepts and signs. Which two processes occurred in sequence?", opts:["Plan Quality Management → Control Quality","Control Quality (QC check) → Validate Scope (customer acceptance)","Validate Scope → Control Quality","Scope Definition → WBS Creation"], correct:1, explanation:"Control Quality (QC) = PM/team inspects deliverables for defects. THEN Validate Scope = customer formally accepts deliverables. QC comes BEFORE Validate Scope." },
      { id:38, section:"Project Charter", diff:"Hard", q:"A PM needs a document that defines the business problem being solved, the strategic justification, the expected benefits and ROI, and outlines the high-level approach.PM think she should refere to Business Case. But a colleague says this should be the Project Charter. Who is correct?", opts:["The colleague — the Project Charter covers all of this","The PM — what is described is a Business Case, which precedes and informs the Project Charter","Both documents are the same","Neither — this information belongs in the Project Management Plan"], correct:1, explanation:"The BUSINESS CASE justifies WHY the project should be approved (problem, ROI, alternatives). It is created BEFORE the project is authorised. The Project Charter is created AFTER approval." },
      { id:39, section:"Schedule Management", diff:"Hard", q:"Activity A: ES=0, EF=5. Activity B: ES=0, EF=8. Activity C depends on both A and B, duration=4 days. Activities D (3d) and E (6d) both depend on C. Activity F depends on both D and E, duration=2 days. Calculate the total project duration.", opts:["Project duration = 14 days via path A-C-D-F","Project duration = 17 days via A-C-E-F","Project duration = 20 days via B-C-E-F (ES(C)=8, EF(C)=12, ES(E)=12, EF(E)=18, ES(F)=18, EF(F)=20)","Project duration = 16 days via B-C-D-F"], correct:2, explanation:"C's ES=MAX(EF_A=5, EF_B=8)=8. EF(C)=12. D:ES=12,EF=15. E:ES=12,EF=18. F's ES=MAX(15,18)=18. EF(F)=20. Critical path: B→C→E→F = 20 days." },
      { id:40, section:"5 Process Groups", diff:"Medium", q:"A project has just been completed. The PM is conducting final project reviews, obtaining formal stakeholder sign-off, archiving project documents, releasing team members, and documenting lessons learned. Which Process Group is she working in?", opts:["Monitoring & Controlling","Executing","Closing","Planning"], correct:2, explanation:"Closing involves final acceptance, formal closure, archiving records, releasing resources, and capturing lessons learned. Key output: Final Project Report." },
    ]
  },
  2: {

    questions: [
      { id:1, section:"PMP Fundamentals", diff:"Hard", q:"A PM is assigned to implement a new hospital management system. Midway through, the board changes strategy — the system will be replaced with a cloud platform in 18 months, making the current project obsolete. The sponsor says to continue since funds are committed. What should the PM recommend?", opts:["Continue the project — the sponsor has authority to make this decision","Immediately stop all project work and refund unused budget","Conduct a formal reassessment of the business case, present the strategic misalignment to the sponsor and steering committee, and recommend terminating or redirecting the project based on current organisational value","Reduce scope to complete a minimal version quickly before the 18-month deadline"], correct:2, explanation:"PMI expects PMs to challenge decisions that undermine project value. The PM must reassess the business case when strategic direction changes. Continuing purely due to sunk cost is wrong — PMI does not accept sunk cost as justification." },
      { id:2, section:"6 Constraints", diff:"Hard", q:"A customer requests a new feature for a software project. Analysis shows: +3 weeks to schedule, +$40,000 cost, +2 developers needed, quality unaffected. The sponsor approves informally over the phone. What must the PM do NEXT?", opts:["Begin adding the feature immediately since the sponsor approved it","Document the sponsor's verbal approval in an email and proceed","Raise a formal change request, assess impacts on ALL constraints, get WRITTEN approval through change control, then update the project management plan","Ask the customer to wait until the next phase"], correct:2, explanation:"PMI requires ALL scope changes to go through formal Integrated Change Control — regardless of verbal sponsor approval. A phone call is NOT a change request. The PM must document, assess all constraints, get written approval, and update the plan." },
      { id:3, section:"PMI Talent Triangle", diff:"Medium", q:"A PM preparing for project kickoff researches how similar projects have been delivered across the industry, studies the latest agile and hybrid delivery models, and identifies which approach best fits the project context. She decides to use a hybrid lifecycle. Which PMI Talent Triangle skill area is she primarily demonstrating?", opts:["Power Skills — she is influencing stakeholders with her delivery decision","Business Acumen — she is connecting project approach to organisational value","Ways of Working — she is selecting the most appropriate delivery methodology and practices for the project","Technical Project Management — she is applying scheduling and planning tools"], correct:2, explanation:"Ways of Working covers knowledge of delivery approaches — predictive, agile, hybrid — and selecting the right method for the context." },
      { id:4, section:"PMP Fundamentals", diff:"Hard", q:"An organisation runs three related projects (customer portal, data migration, staff training) coordinated to deliver a full digital transformation. A new PM joins and is told to 'manage the programme.' Each project already has its own PM. What is the programme manager's PRIMARY role?", opts:["Manage the day-to-day delivery of all three projects simultaneously","Replace the three individual PMs with a single unified project team","Coordinate the interdependencies between the three projects, manage shared resources, and ensure the combined deliverables produce the intended strategic outcome","Report project status to the PMO on behalf of all three project managers"], correct:2, explanation:"Programme management adds value by coordinating related projects to achieve COMBINED BENEFITS that individual projects cannot deliver alone. The programme manager manages interdependencies, shared risks, and strategic alignment." },
      { id:5, section:"Role of the PM", diff:"Hard", q:"A PM notices two functional teams are developing components that need to integrate at the end of the project. Neither team is aware of the other's technical specifications. The integration is 4 months away. The PM is not a technical expert. What should she do FIRST?", opts:["Escalate to the sponsor immediately and ask them to resolve the issue","Wait until integration testing to identify and resolve any incompatibilities","Facilitate a technical alignment meeting between the two teams now, document integration specifications, and update the project plan with integration checkpoints","Hire an external integration consultant to manage the technical dependency"], correct:2, explanation:"The PM's role is to proactively identify and manage risks and dependencies — not wait for problems to occur. The PM facilitates collaboration between teams, even without being a technical expert." },
      { id:6, section:"PMP Fundamentals", diff:"Medium", q:"A project is high-risk because the organisation has never attempted this type of project and requirements are poorly understood. A colleague suggests an iterative approach where the team delivers working outputs in small increments to gather feedback and refine requirements. Which characteristic of projects does this scenario BEST illustrate?", opts:["Projects are always delivered using predictive (waterfall) methods","Projects involve uncertainty — different delivery approaches manage that uncertainty differently, and the PM must select the approach that fits the context","Projects must always produce a full plan before beginning — uncertainty is not acceptable","Projects with high uncertainty should be cancelled until requirements are clear"], correct:1, explanation:"PMI ECO 2021: projects involve uncertainty. The PM tailors the delivery approach to the level of uncertainty. High uncertainty = iterative/agile approaches." },
      { id:7, section:"PMI Talent Triangle", diff:"Hard", q:"A PM proposes to the board to increase the project budget by 15% due to unexpected regulatory changes. She presents a revised cost-benefit analysis showing the investment protects the organisation from a $2M compliance penalty and maps the project outcome to the company's 3-year strategic revenue target. The board approves. Which PMI Talent Triangle skill area enabled the PM to secure approval?", opts:["Ways of Working — she used project management tools effectively","Power Skills — she influenced stakeholders and communicated persuasively","Business Acumen — she demonstrated financial literacy, strategic alignment, and value justification","Both Power Skills and Business Acumen — both were equally demonstrated"], correct:3, explanation:"This scenario demonstrates BOTH Power Skills (stakeholder influence, persuasive communication) AND Business Acumen (financial analysis, ROI, cost-benefit, strategic mapping). Real PM situations often require multiple Talent Triangle skills simultaneously." },
      { id:8, section:"6 Constraints", diff:"Hard", q:"A project is 2 weeks behind schedule due to a supplier delay. Option 1: Fast track two activities (increases risk). Option 2: Add a weekend shift (+$30,000). Option 3: Reduce scope by removing two non-critical deliverables. The sponsor says 'Money is not the constraint here.' What should the PM do?", opts:["Immediately implement Option 2 — adding resources — since the sponsor approved cost increase","Select Option 3 since reducing scope is always the safest option","Analyse all three options including their impact on quality, risk, and stakeholder satisfaction, present the options to the sponsor with a recommendation, and implement the approved approach through formal change control","Use Option 1 and Option 2 simultaneously for maximum schedule recovery"], correct:2, explanation:"Even with verbal sponsor approval, the PM must analyse all constraint impacts, document options, and get formal approval before implementing. The sponsor's comment narrows focus but does not eliminate the PM's obligation to present options and get formal sign-off." },
      { id:9, section:"People Domain", diff:"Hard", q:"A team member consistently delivers excellent technical work but frequently dismisses colleagues' ideas in team meetings. Two team members have privately complained and are considering transferring off the project. What should the PM do FIRST?", opts:["Reassign the disruptive team member to solo technical tasks away from team meetings","Report the behaviour to HR immediately","Have a private, direct conversation with the team member, share specific observations of the behaviour and its impact on the team, listen to their perspective, and establish agreed expectations","Address the issue publicly in the next team meeting so all team members understand the expected behaviour"], correct:2, explanation:"PMI: address interpersonal issues directly and privately FIRST. The PM should describe the observable behaviour (not label the person), explain the impact, listen, and agree on expectations. HR is a last resort. Public confrontation damages trust." },
      { id:10, section:"Conflict Resolution", diff:"Hard", q:"Two senior stakeholders have a long-standing disagreement about which technology platform to use. The conflict is delaying key architectural decisions and impacting the project schedule. The PM has attempted to facilitate discussions multiple times but neither party will budge. Both stakeholders report to the same VP. What should the PM do?", opts:["Make the technology decision herself to unblock the project","Escalate the decision to the VP and document that the delay is caused by stakeholder disagreement, while continuing to keep both parties engaged","Tell both stakeholders the project will be cancelled if they don't decide within 48 hours","Flip a coin or randomise the selection to appear neutral"], correct:1, explanation:"When the PM has exhausted direct facilitation and the conflict involves stakeholders outside the PM's authority, escalation to the appropriate authority is appropriate. PMI expects escalation as a legitimate tool — not a failure." },
      { id:11, section:"Leadership Styles", diff:"Hard", q:"A PM takes over a troubled project. The previous PM left abruptly, the team is demoralised, processes are unclear, and deliverables are overdue. Team members are experienced professionals who previously worked well together. What leadership approach is MOST appropriate?", opts:["Delegating — experienced teams should self-organise without PM direction","Coaching — the PM should teach the team new project management techniques","Directing (Telling) — the situational need is stability and clear structure, temporarily requiring more directive leadership despite the team's experience level","Laissez-faire — give the team space to recover and self-direct"], correct:2, explanation:"Situational leadership: the appropriate style depends on CONTEXT, not just team experience. Even experienced teams in a crisis need directive, stabilising leadership temporarily." },
      { id:12, section:"Motivation Theories", diff:"Hard", q:"Despite offering bonuses for early delivery, team performance has not improved. Under Herzberg, bonuses are hygiene factors, not motivators. Which redesign BEST applies Herzberg's motivator principles?", opts:["Increase the bonus amount — if the current bonus is not working, a larger one will","Reduce working hours to improve work-life balance","Assign team members to challenging and meaningful work, provide public recognition for achievements, and create clear paths for advancement","Implement stricter accountability measures to ensure team members deliver"], correct:2, explanation:"Herzberg's MOTIVATORS are: achievement, recognition, the work itself (challenging/meaningful), responsibility, and advancement. Hygiene factors (salary, bonuses, work conditions) only prevent dissatisfaction — they do NOT motivate." },
      { id:13, section:"Tuckman's Stages", diff:"Hard", q:"A team working together for 8 months collaborates seamlessly, resolves issues independently, and delivers above expectations. One team member says 'We barely need the PM anymore.' A new team member joins and immediately challenges the team's established workflow. Which two Tuckman stages are happening simultaneously?", opts:["Forming (due to the new member) and Norming (original team establishing rules)","The original team is in Performing. The addition of the new member has re-triggered Forming/Storming dynamics for the whole team","The team is in Adjourning since the PM is no longer needed","The team is in Norming and the new member is in Forming — these run separately"], correct:1, explanation:"A high-performing team can regress when its composition changes. The new member challenging established workflows is a Storming trigger. PMI: team development is not linear." },
      { id:14, section:"Servant Leadership", diff:"Hard", q:"An agile PM leads a Scrum team. The Product Owner continuously asks the SM to assign specific tasks to specific developers, arguing she knows which developer is best for each story. The SM is concerned this is undermining self-organisation. Which response BEST reflects servant leadership principles?", opts:["Allow the PO to assign tasks — she has the authority as Product Owner to direct all project work","Ignore the PO's requests and tell the team to self-assign work as usual","Meet privately with the PO, explain that task assignment is the team's authority (not the PO's), and coach her on the Scrum role boundaries — the PO sets WHAT, the team decides HOW","Escalate the PO's behaviour to the project sponsor as a Scrum process violation"], correct:2, explanation:"Servant leadership includes coaching all roles — including the PO — on the boundaries of their authority. The SM protects the team's right to self-organise. Direct private coaching is the first step." },
      { id:15, section:"People Domain", diff:"Hard", q:"A high-performing team member who has been excellent for 6 months has recently become disengaged, missing reviews and delivering lower quality work. In a recent all-hands, they seemed withdrawn. What should the PM do FIRST?", opts:["Put the team member on a formal performance improvement plan immediately","Ask other team members to find out what is happening with their colleague","Schedule a private one-on-one conversation with the team member — ask open-ended questions to understand what has changed, listen without judgment, and offer support BEFORE any performance management decisions","Reassign the team member's critical tasks to others to protect project delivery"], correct:2, explanation:"PMI: a sudden performance change in a previously excellent team member is almost always a signal of an underlying issue. The PM must enquire privately and empathetically BEFORE any performance management action." },
      { id:16, section:"Stakeholder Management", diff:"Hard", q:"A PM mapped all stakeholders. The Head of IT Security has low current interest but could block deployment if security requirements are not met. The PM has only been sending the standard weekly status report. In month 2, the Head of IT Security raises a critical security concern that should have been flagged in month 1. What mistake did the PM make?", opts:["No mistake — the standard report was sent. The IT Security Head should have raised concerns earlier","The PM engaged the wrong stakeholder — IT Security is not part of a software project's stakeholder group","The PM failed to proactively identify and manage a high-impact stakeholder's specific needs. The PM should now immediately engage the Head of IT Security in a structured way — review requirements together, assess the gap, raise a change request if needed, and adjust the engagement plan","The PM should escalate the IT Security Head's late concern to the sponsor"], correct:2, explanation:"High power + potentially high impact ≠ low engagement. The PM misjudged this stakeholder's importance. A standard report was insufficient — the PM should have proactively engaged with domain-specific questions about security requirements early." },
      { id:17, section:"People Domain", diff:"Medium", q:"A team member says: 'I cannot keep working at this pace. I haven't been home for dinner with my family in three weeks. I'm burning out.' Three critical deliverables are due next week. What should you do FIRST?", opts:["Acknowledge their concern and tell them to hold on until next week's milestone is passed","Tell the team member the project comes first and they agreed to the timeline when they joined","Listen to the team member fully, validate their concern, then work with them to explore what workload adjustments or support is possible — even during the critical period — and commit to a longer-term fix after the milestone","Immediately reassign all their critical tasks to another team member to relieve the pressure"], correct:2, explanation:"PMI: the PM is responsible for the team's wellbeing. Sustainable pace is a core principle. Dismissing burnout signals leads to team breakdown. The PM must listen, validate, and problem-solve collaboratively." },
      { id:18, section:"Motivation Theories", diff:"Hard", q:"A PM finds: Team A members are energised by solving complex technical problems autonomously. Team B members are motivated by leading sub-teams and building influence. Team C members want collaborative success and team belonging. Using McClelland's Needs Theory, how should she structure motivation for each group?", opts:["Apply the same reward system to everyone — fairness means identical treatment","Team A: Achievement (challenging autonomous work). Team B: Power (leadership roles, influence). Team C: Affiliation (team-based goals and social connection). Tailor the environment for each need","Apply Maslow — focus on salary and safety for all teams first before any other motivation","Ignore the cultural differences — the project has a single performance standard that applies to everyone"], correct:1, explanation:"McClelland's three needs: Achievement (nAch) = challenging work. Power (nPow) = influence, leadership. Affiliation (nAff) = belonging, collaboration. Effective PMs identify the dominant need and create conditions that address it." },
      { id:19, section:"Emotional Intelligence", diff:"Hard", q:"During a tense project review, the PM receives harsh criticism about a schedule delay. Several executives are openly sceptical. The PM feels flustered internally but responds calmly: 'Thank you for raising this directly. I understand the concern. I'd like to walk through the recovery plan we've developed.' She then presents a clear recovery strategy. Which EI dimension does this BEST demonstrate?", opts:["Empathy — she acknowledged the executives' perspective","Self-awareness — she recognised her internal emotional state","Self-regulation — she was aware of her emotional reaction but managed it to respond constructively rather than defensively","Social skill — she used the situation to build a relationship with the executives"], correct:2, explanation:"Self-regulation is the ability to control disruptive emotions and impulses — especially under pressure. The PM felt flustered (self-awareness) but chose NOT to act from that emotion (self-regulation)." },
      { id:20, section:"People Domain", diff:"Hard", q:"A PM discovers that a team member has been reporting 8 hours per day on the timesheet while actually working only 4-5 hours. The project is a government contract where labour hours are billed to the client. The team member is well-liked and delivers good work. What must the PM do?", opts:["Speak privately with the team member and ask them to correct the behaviour — no need to escalate if they agree to change","Ignore the issue — the team member delivers good work and the relationship is more important","Report the timesheet fraud through the appropriate organisational and/or contractual compliance channel immediately — this is a legal and ethical obligation regardless of the team member's likability","Remove the team member from the project quietly and do not document the reason to protect their career"], correct:2, explanation:"PMI Code of Ethics: honesty and responsibility are mandatory. Billing false hours to a government client is fraud. The PM has a legal and ethical obligation to report through proper channels. Concealing it makes the PM complicit." },
      { id:21, section:"Project Charter", diff:"Hard", q:"A PM has been verbally assigned to a project. After two weeks, she has been gathering requirements and building a project plan. A colleague says: 'You shouldn't be doing any of this yet — you don't have a Project Charter.' Is the colleague correct?", opts:["No — the verbal assignment from the department head is sufficient authority to begin planning","Yes — without a Project Charter, the PM has no formal authority to use resources, commit budget, or represent the project. All work done so far is at risk of being disowned if the project is not formally authorised","The colleague is partially correct — the PM can plan but not spend budget without a Charter","No — the Project Charter is a formality. Real PM authority comes from relationships and influence"], correct:1, explanation:"The Project Charter is the ONLY document that formally authorises the project and grants the PM authority. Verbal assignment creates no formal authority. All work done without it is at risk of being challenged or cancelled." },
      { id:22, section:"5 Process Groups", diff:"Hard", q:"A PM realises that a risk she identified in planning has occurred and has caused a schedule variance. She immediately implements the risk response plan, submits a change request, updates the risk register, issues a revised status report, and schedules a lessons learned session. Which Process Groups are ACTIVE simultaneously?", opts:["Only Monitoring & Controlling — since the PM is responding to a variance","Only Executing — since the PM is implementing the response plan","Executing (implementing the response), Monitoring & Controlling (tracking variance, submitting change request, updating register, reporting status), and Planning (updating the PM plan post-change approval)","Initiating and Closing — the project must be restarted to address the risk"], correct:2, explanation:"Multiple Process Groups run simultaneously throughout a project. Executing, Monitoring & Controlling, and Planning (for re-planning after change approval) are all active. PMI emphasises that process groups are iterative and overlapping." },
      { id:23, section:"Stakeholder Identification", diff:"Hard", q:"A highway project passes through three villages. The PM identifies the Ministry of Transport, the construction contractor, and the engineering team as stakeholders. A colleague notes that the 12,000 residents of the affected villages, local environmental groups, and opposition MPs representing those constituencies have NOT been identified. What is the consequence?", opts:["No consequence — individual citizens are not project stakeholders; only formal organisations qualify","The PM has violated the 100% Rule of the WBS by missing scope","The omission creates significant project risk — unidentified stakeholders with high interest and potential influence can oppose, delay, or stop the project. The PM must immediately conduct a comprehensive stakeholder analysis","The omission is acceptable — community groups have no formal authority over government infrastructure projects"], correct:2, explanation:"PMI: stakeholders are anyone who may affect or be affected by the project — formal authority is NOT required. Residents, community groups, and elected officials representing affected communities have high interest and can create powerful opposition." },
      { id:24, section:"Scope Management", diff:"Hard", q:"A PM successfully delivers all scope in the WBS and the customer signs final acceptance. Six months later, the customer says the system cannot handle peak load volumes that were never discussed during the project. The customer insists this was an implied requirement. Who bears responsibility?", opts:["The customer is correct — implied requirements are always the PM's responsibility","The PM bears full responsibility because performance requirements should always be included in software projects","The PM fulfilled their contractual obligation based on the agreed scope statement. However, non-functional requirements (performance, scalability, security) must be explicitly documented during scope definition","The contractor bears full responsibility — they should have stress-tested the system regardless of the scope statement"], correct:2, explanation:"The PM delivered to the agreed scope statement. However, this illustrates a common trap: non-functional requirements (NFRs) are often missed during scope definition. Best practice requires explicitly eliciting and documenting NFRs." },
      { id:25, section:"WBS", diff:"Hard", q:"During project execution review, the team discovers 'System Integration Testing' was never included in the WBS or project schedule. It is estimated to take 3 weeks and require a specialist. The project is currently on schedule for delivery in 6 weeks. What should the PM do?", opts:["Absorb the testing within the existing 6-week timeline by compressing other activities","Simply add integration testing to the schedule without a formal change request since it was always part of the work","Raise a formal change request to add the missing scope, assess the impact on schedule, cost, and resources, inform the sponsor, and adjust the baseline accordingly","Complete the project as planned and conduct integration testing as a post-project activity"], correct:2, explanation:"A missing WBS element discovered during execution represents a gap in the original plan. Even if the work was always required, adding it now changes the baseline. A formal change request is required." },
      { id:26, section:"Schedule Management", diff:"Hard", q:"The project network has four paths: Path Alpha: 22 days, Path Beta: 27 days, Path Gamma: 27 days, Path Delta: 19 days. The sponsor mandates completion in 24 days. What is the current situation and what must the PM address?", opts:["The project can be delivered in 24 days — average all four paths","The project is currently 3 days over the 24-day mandate. Paths Beta and Gamma are BOTH critical at 27 days. Both must be compressed by at least 3 days — compressing only one will not solve the problem","Only Path Beta needs compression since it appeared first in the analysis","The project should be delivered in 27 days and the sponsor's 24-day mandate should be renegotiated"], correct:1, explanation:"Project duration = LONGEST path = 27 days. TWO paths (Beta and Gamma) are both at 27 days — both are critical. To meet 24 days, BOTH must be compressed. Compressing only Beta by 3 days would still leave Gamma as the new critical path." },
      { id:27, section:"Critical Path Method", diff:"Hard", q:"Activity calculations: J has ES=14, EF=19, LS=14, LF=19 (TF=0). K has ES=10, EF=18, LS=12, LF=20 (TF=?). L has ES=18, EF=22, LS=18, LF=22 (TF=0). The sponsor asks the PM to add resources to Activity K to shorten the project. The PM advises against it. Why is the PM correct?", opts:["The PM is wrong — adding resources always shortens the project","The PM is correct because Activity K has a Total Float of 2 days. It is NOT on the critical path. Crashing K will not shorten the project end date — only critical path activities (Float=0) affect project duration when crashed","The PM is correct because Activity K cannot be crashed due to its dependency on Activity J","The PM is correct because crashing is always more expensive than fast tracking and should be avoided"], correct:1, explanation:"TF(K) = LS-ES = 12-10 = 2 days. Non-zero float = NOT on the critical path. Activities J and L have TF=0 — they ARE critical. Crashing K wastes money without shortening the project." },
      { id:28, section:"Critical Path Method", diff:"Hard", q:"5 activities: A(dur=3, no predecessor). B(dur=6, pred A). C(dur=4, pred A). D(dur=5, preds B and C). E(dur=2, pred D). Calculate the Early Start and Early Finish for Activity D.", opts:["ES(D)=9, EF(D)=14 — by taking EF(B)=9 as D's start","ES(D)=7, EF(D)=12 — by taking EF(C)=7 as D's start","ES(D)=9, EF(D)=14 — ES(D) = MAX(EF_B=9, EF_C=7) = 9; EF(D) = 9+5 = 14","ES(D)=8, EF(D)=13 — by averaging EF(B) and EF(C)"], correct:2, explanation:"A: ES=0,EF=3. B(pred A): ES=3,EF=9. C(pred A): ES=3,EF=7. D(preds B AND C): ES = MAX(EF_B=9, EF_C=7) = 9. EF(D) = 9+5 = 14. Critical rule: when multiple predecessors, take the LARGEST EF. Never average." },
      { id:29, section:"Schedule Compression", diff:"Hard", q:"A PM must recover 4 days. Activity M: crash 2 days for $8,000 ($4,000/day). Activity N: crash 3 days for $6,000 ($2,000/day). Activity P: crash 4 days for $20,000 ($5,000/day). What is the MINIMUM cost to recover exactly 4 days?", opts:["Crash P by 4 days — it saves the most time for one activity: $20,000","Crash N by 3 days ($6,000) + Crash M by 1 day ($4,000) = $10,000 total — lowest cost per day approach","Crash M by 2 days ($8,000) + Crash N by 2 days ($4,000) = $12,000","Crash all three activities simultaneously to ensure 4 days are recovered"], correct:1, explanation:"Always crash the CHEAPEST per-day activity first. N=$2,000/day (cheapest) — crash 3 days = $6,000. Still need 1 more day. Next cheapest: M=$4,000/day — crash 1 day = $4,000. Total: $10,000 for 4 days recovered." },
      { id:30, section:"Project Charter", diff:"Hard", q:"During project execution, a PM realises the Project Charter was created without consulting her and contained unrealistic timeline and budget commitments. A team member suggests simply ignoring the Charter and creating a new plan. What should the PM do?", opts:["Agree with the team member and create a new, realistic plan without informing the sponsor","Conduct a formal analysis of the variance between Charter targets and realistic estimates, present findings and a change request to the sponsor for approval of revised targets, and update the project management plan formally","Continue trying to meet the unrealistic Charter targets — the PM accepted the project and is bound by the original commitments","Escalate to the PMO to have the Charter rewritten by a different team"], correct:1, explanation:"The PM must surface unrealistic baselines honestly and formally. Creating a hidden parallel plan is dishonest. The correct approach is a formal change request to reset targets based on realistic estimates — with transparency to the sponsor." },
      { id:31, section:"Scope Management", diff:"Hard", q:"The development team is working on a feature in the WBS. A senior developer says: 'I added a data analytics dashboard to this module because I knew the customer would love it — it only took me two days.' The dashboard was not in the scope statement or WBS. The customer did not request it. What is this, and what must the PM do?", opts:["This is a value-adding initiative and should be praised as going above and beyond","This is gold plating — delivering features beyond the agreed scope without authorisation. The PM must assess whether to retain or remove the dashboard, document it, and if retaining it, process it through formal change control to add it to the scope baseline","This is scope creep — but since the developer has already built it, the PM should simply include it in the project deliverables","This is acceptable as long as it does not affect the schedule or budget"], correct:1, explanation:"Gold plating = adding unauthorised features beyond agreed scope, even with good intentions. It is a scope management failure. Risks: the feature may not be tested, may cause bugs, and may misuse budget. Change control is required." },
      { id:32, section:"5 Process Groups", diff:"Medium", q:"A PM has completed all deliverables, obtained customer acceptance, and released the project team. She is now conducting final performance reviews, archiving project records, updating the organisational process assets, and ensuring all contracts are formally closed. What is the PRIMARY purpose of this Process Group?", opts:["Monitoring & Controlling — she is reviewing final performance","Executing — she is completing remaining administrative tasks","Closing — to formally complete the project, confirm all deliverables are accepted, archive knowledge, release resources, and close all contracts formally","Planning — she is documenting lessons for future project planning"], correct:2, explanation:"Closing involves: final acceptance confirmation, releasing resources, closing contracts, archiving documents, capturing lessons learned, and issuing the Final Project Report. Projects must not simply fade away." },
      { id:33, section:"WBS", diff:"Hard", q:"A senior engineer insists the WBS should be organised by engineering functions (Mechanical, Electrical, Civil) rather than by deliverables. The PM prefers a deliverable-based WBS. Which approach is more aligned with PMI best practice?", opts:["The engineer is correct — functional WBS is always the PMI standard because it aligns with how teams are organised","Both approaches are equally acceptable — WBS structure is a matter of organisational preference","The deliverable-based WBS is generally preferred by PMI because it focuses on WHAT must be produced (outputs) rather than WHO does the work (functions). It supports the 100% Rule by ensuring all outputs are captured regardless of which function produces them","The PM should always follow the senior engineer's preference to avoid conflict"], correct:2, explanation:"PMI: the WBS should be oriented around DELIVERABLES, not organisational functions or activities. A deliverable-based WBS applies the 100% Rule more effectively and avoids gaps." },
      { id:34, section:"Stakeholder Management", diff:"Hard", q:"A PM identifies a stakeholder who was categorised as 'Unaware' of the project — the head of a regulatory body that must approve the project output before deployment. The PM has not engaged this stakeholder in 4 months of planning. The approval process takes 8 weeks. The project is 10 weeks from planned delivery. What is the IMMEDIATE risk?", opts:["There is no risk — regulatory approval is outside the project scope and is the sponsor's responsibility","The PM faces a schedule risk of at least 8 weeks (regulatory approval time) that was not planned. The PM must immediately engage the regulator, understand the full approval requirements, assess the schedule impact, raise a change request to extend the timeline, and update the stakeholder engagement plan","The PM should rush the approval process by delivering the minimum required documentation immediately","The PM should ask the sponsor to waive the regulatory approval to protect the project deadline"], correct:1, explanation:"An unengaged regulatory stakeholder with mandatory approval authority represents a CRITICAL schedule risk. 8-week approval + 10 weeks to delivery = potential 8-week overrun. The PM must engage the regulator now and be transparent with the sponsor." },
      { id:35, section:"Schedule Management", diff:"Hard", q:"The UI design team wants to begin building screen prototypes (Activity B) before the requirements document (Activity A) is finalised. Activity A is 12 days long. Activity B starts 4 days before Activity A finishes. Which dependency type and modification BEST represents this relationship?", opts:["Finish-to-Start (FS): A must fully finish before B can start","Start-to-Start (SS): B can start when A starts, with no lag","Finish-to-Start with a Lead of 4 days (FS-4d): B starts 4 days before A finishes, overlapping the final 4 days","Start-to-Finish (SF): A must start before B can finish"], correct:2, explanation:"This is Fast Tracking via a LEAD on an FS dependency. FS-4d means B starts 4 days BEFORE A finishes (they overlap for 4 days). FS-4d is the precise way to model this specific timing relationship." },
      { id:36, section:"Project Charter", diff:"Medium", q:"A project charter has been signed by the sponsor. Two weeks later, the CFO — who did not sign the charter — sends an email saying the project budget should be reduced by 30% and the timeline compressed by 2 months, effective immediately. What should the PM do?", opts:["Implement the CFO's instructions immediately — the CFO outranks the sponsor financially","Acknowledge the CFO's email, explain that the approved charter defines the current authorised parameters, and request that any changes be processed through the formal change control process with the project sponsor's involvement","Inform the project team of the changes and begin adjusting the plan","Ignore the CFO's email — only the sponsor can direct the PM"], correct:1, explanation:"The Project Charter defines the authorised parameters. Changes to charter-level commitments require formal change control involving the sponsor — not unilateral directives from non-authorising parties, regardless of seniority." },
      { id:37, section:"5 Process Groups", diff:"Hard", q:"A PM is simultaneously: (1) executing the current sprint, (2) reviewing earned value metrics and identifying a cost variance, (3) updating the risk register with two newly identified risks, and (4) preparing the next phase's detailed plan. Which Process Groups are occurring at the same time?", opts:["Only Executing — all other activities happen sequentially after Executing is complete","Executing (sprint delivery), Monitoring & Controlling (EVM review, risk register update), and Planning (next phase planning) are all active simultaneously","Executing and Monitoring & Controlling only — Planning only happens at the start of the project","Planning and Closing — since the PM is preparing for the next phase"], correct:1, explanation:"PMI: process groups are iterative and can overlap throughout the project. Executing, Monitoring & Controlling, and Planning (for future phases) commonly run simultaneously on active projects." },
      { id:38, section:"Scope Management", diff:"Hard", q:"A customer calls the PM directly and asks to add a new report generation feature, saying 'It's only a small change — it should take a day at most.' The team lead says it is actually a complex change requiring database schema modifications and will take at least 2 weeks. The PM agrees with the team lead's estimate. What should the PM do?", opts:["Implement the feature as the customer requests — they are paying for the project and have the right to decide what is simple","Ask the team lead to find a way to do it in one day to meet the customer's expectation","Explain to the customer that scope changes — regardless of perceived size — must go through the formal change control process. Present the team's 2-week impact assessment, raise a change request, and get formal approval before any work begins","Implement the change informally and track it as a separate project outside the main scope"], correct:2, explanation:"There is no such thing as a 'small' change that bypasses change control. PMI: ALL scope changes require formal change requests. The customer's perception of simplicity is irrelevant — the team's technical assessment defines the actual impact." },
      { id:39, section:"Schedule Management", diff:"Hard", q:"Activity Q shows: ES=8, EF=13, LS=10, LF=15, Duration=5. Activity R (which follows Q in an FS relationship): ES=13, EF=20, LS=13, LF=20, Duration=7. What can the PM conclude about Activities Q and R?", opts:["Both Q and R are on the critical path since R has zero float","Activity Q has Total Float=2 days and is NOT on the critical path. Activity R has Total Float=0 and IS on the critical path. Q can be delayed up to 2 days without delaying R's start or the project end","Both Q and R have zero float and are both critical path activities","Activity Q is critical because it directly precedes Activity R"], correct:1, explanation:"TF(Q) = LS-ES = 10-8 = 2 days. NOT critical. TF(R) = LS-ES = 13-13 = 0 days. CRITICAL. Q can absorb up to 2 days of delay before impacting R." },
      { id:40, section:"Process Domain", diff:"Hard", q:"INTEGRATION QUESTION: A PM is 60% through a government infrastructure project. CPI=0.82, SPI=0.91, business case ROI has dropped from 22% to 9%, two critical path activities have zero remaining float, a new regulatory requirement adds 3 weeks, and the project sponsor just announced she is leaving the organisation in 2 weeks. What is the PM's MOST URGENT first action?", opts:["Focus on the CPI — implement emergency cost controls to bring spending back to budget","Fast-track the two zero-float activities immediately to recover schedule","Urgently brief the incoming sponsor (or interim authority) on all project status, risks, and open issues — loss of sponsor support at this moment is the most immediately destabilising risk to project continuity. All other actions depend on having sustained governance authority","Raise a change request for the new regulatory requirement and address each issue sequentially"], correct:2, explanation:"With a deteriorating business case, schedule and cost variances, a new regulatory requirement AND a departing sponsor — the most urgent risk is GOVERNANCE CONTINUITY. Without a committed sponsor, the PM cannot get change requests approved or maintain executive support. All other corrective actions depend on it." },
    ]

// ─── STORAGE HELPERS ──────────────────────────────────────────────
async function saveResult(name, paperId, score, total, answers, sectBreakdown) {
  const key = `submission:${Date.now()}:${name.replace(/\s+/g,'_')}:p${paperId}`;
  const val = JSON.stringify({ name, paperId, score, total, pct: Math.round(score/total*100), answers, sectBreakdown, ts: new Date().toISOString() });
  try { await window.storage.set(key, val, true); } catch(e) { console.error(e); }
}

async function loadAllResults() {
  try {
    const { keys } = await window.storage.list("submission:", true);
    const results = [];
    for (const k of keys) {
      try {
        const r = await window.storage.get(k, true);
        if (r) results.push(JSON.parse(r.value));
      } catch(e) {}
    }
    return results.sort((a,b) => new Date(b.ts) - new Date(a.ts));
  } catch(e) { return []; }
}

    if (confirmed) return;
    setSelected(idx);

  function confirmAnswer() {
    if (selected === null || confirmed) return;
    setConfirmed(true);
    setShowExpl(true);
    setAnswers(prev => ({ ...prev, [currentQ]: selected }));
  }

  function nextQ() {
    if (currentQ < questions.length - 1) {
      setCurrentQ(c => c + 1);
      setSelected(answers[currentQ+1] ?? null);
      setConfirmed(answers[currentQ+1] !== undefined);
      setShowExpl(answers[currentQ+1] !== undefined);
    } else {
      handleSubmit();
    }
  }

  function prevQ() {
    if (currentQ > 0) {
      const prev = currentQ - 1;
      setCurrentQ(prev);
      setSelected(answers[prev] ?? null);
      setConfirmed(answers[prev] !== undefined);
      setShowExpl(answers[prev] !== undefined);
    }
  }

  async function handleSubmit() {
    clearInterval(timerRef.current);
    let score = 0;
    const sectMap = {};
    questions.forEach((q, i) => {
      const ans = answers[i];
      const correct = ans === q.correct;
      if (correct) score++;
      if (!sectMap[q.section]) sectMap[q.section] = { correct:0, total:0 };
      sectMap[q.section].total++;
      if (correct) sectMap[q.section].correct++;
    });
    const res = { score, total: questions.length, pct: Math.round(score/questions.length*100), sectMap, answers };
    setResults(res);
    await saveResult(studentName, paperId, score, questions.length, answers, sectMap);
    setScreen("result");

      setShowPassModal(true);
