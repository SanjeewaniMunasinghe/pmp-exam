            )}
          </div>

          {/* Q navigator */}
          <div style={{ marginTop:28, display:"flex", flexWrap:"wrap", gap:6 }}>
            {questions.map((_, i) => {
              const isDone = answers[i] !== undefined;
              const isRight = isDone && answers[i] === questions[i].correct;
              const isCurrent = i === currentQ;
              return (
                <button key={i} onClick={() => { setCurrentQ(i); setSelected(answers[i]??null); setConfirmed(answers[i]!==undefined); setShowExpl(answers[i]!==undefined); }}
                  style={{ width:32, height:32, borderRadius:6, border: isCurrent?`2px solid ${paper.color}`:"1px solid #E2E8F0", background: isCurrent?paper.color: !isDone?"#fff": isRight?"#D1FAE5":"#FEE2E2", color: isCurrent?"#fff": !isDone?"#94A3B8": isRight?"#059669":"#DC2626", fontWeight:700, fontSize:11, cursor:"pointer" }}>
                  {i+1}
                </button>
              );
            })}
          </div>
        </div>
      </div>
    );
  }

  // ─── RESULT ────────────────────────────────────────────────────
  if (screen === "result" && results) {
    const grade = getGrade(results.pct);
    return (
      <div style={{ minHeight:"100vh", background:"linear-gradient(135deg,#0F2557 0%,#1E3A5F 60%,#0D9488 100%)", fontFamily:"'Segoe UI',system-ui,sans-serif", padding:"32px 20px" }}>
        <div style={{ maxWidth:760, margin:"0 auto" }}>
          {/* Score card */}
          <div style={{ background:"rgba(255,255,255,0.08)", border:"1px solid rgba(255,255,255,0.15)", borderRadius:20, padding:"36px 32px", marginBottom:24, textAlign:"center" }}>
            <div style={{ fontSize:64, marginBottom:8 }}>{results.pct>=70?"🎉":"📚"}</div>
            <h1 style={{ color:"#fff", fontSize:32, fontWeight:800, margin:"0 0 4px" }}>{studentName}</h1>
            <p style={{ color:"#BAE6FD", fontSize:16, margin:"0 0 28px" }}>Paper {paperId} · {paper?.title}</p>

            <div style={{ display:"flex", justifyContent:"center", gap:24, marginBottom:28, flexWrap:"wrap" }}>
              <div>
                <div style={{ color:"rgba(255,255,255,0.6)", fontSize:12, fontWeight:600, letterSpacing:1 }}>SCORE</div>
                <div style={{ color:"#fff", fontSize:52, fontWeight:800, lineHeight:1 }}>{results.score}<span style={{ fontSize:28, color:"rgba(255,255,255,0.5)" }}>/{results.total}</span></div>
              </div>
              <div style={{ borderLeft:"1px solid rgba(255,255,255,0.2)", paddingLeft:24 }}>
                <div style={{ color:"rgba(255,255,255,0.6)", fontSize:12, fontWeight:600, letterSpacing:1 }}>PERCENTAGE</div>
                <div style={{ color: results.pct>=70?"#6EE7B7":"#FCA5A5", fontSize:52, fontWeight:800, lineHeight:1 }}>{results.pct}%</div>
              </div>
            </div>

            <div style={{ display:"inline-block", background:grade.bg, color:grade.color, borderRadius:100, padding:"10px 28px", fontWeight:800, fontSize:18, marginBottom:20 }}>
              {grade.label}
            </div>

            <div style={{ background:"rgba(255,255,255,0.06)", borderRadius:12, padding:"14px 20px" }}>
              <p style={{ color:"#BAE6FD", margin:0, fontSize:14, lineHeight:1.6 }}>
                {results.pct>=70 ? "Well done! You are on track for the real PMP exam. Review any incorrect answers carefully before your next session." : "Keep studying! Focus on the sections highlighted in red below. Complete the recommended reading before the next session."}
              </p>
            </div>
          </div>

          {/* Section breakdown */}
          <div style={{ background:"rgba(255,255,255,0.08)", border:"1px solid rgba(255,255,255,0.15)", borderRadius:20, padding:"28px 32px", marginBottom:24 }}>
            <h2 style={{ color:"#fff", fontSize:18, fontWeight:700, marginBottom:20 }}>Performance by Topic</h2>
            {Object.entries(results.sectMap).sort((a,b)=>b[1].correct/b[1].total - a[1].correct/a[1].total).map(([sect, d]) => {
              const pct = Math.round(d.correct/d.total*100);
              const col = pct>=70?"#6EE7B7":pct>=50?"#FCD34D":"#FCA5A5";
              return (
                <div key={sect} style={{ marginBottom:14 }}>
                  <div style={{ display:"flex", justifyContent:"space-between", marginBottom:4 }}>
                    <span style={{ color:"#E0F2FE", fontSize:13, fontWeight:600 }}>{sect}</span>
                    <span style={{ color:col, fontSize:13, fontWeight:700 }}>{d.correct}/{d.total} ({pct}%)</span>
                  </div>
                  <div style={{ background:"rgba(255,255,255,0.1)", borderRadius:100, height:8 }}>
                    <div style={{ background:col, borderRadius:100, height:8, width:`${pct}%`, transition:"width 0.6s" }} />
                  </div>
                </div>
              );
            })}
          </div>

          {/* Per-question review */}
          <div style={{ background:"rgba(255,255,255,0.08)", border:"1px solid rgba(255,255,255,0.15)", borderRadius:20, padding:"28px 32px", marginBottom:24 }}>
            <h2 style={{ color:"#fff", fontSize:18, fontWeight:700, marginBottom:20 }}>Question-by-Question Review</h2>
            {questions.map((qItem, i) => {
              const userAns = results.answers[i];
              const correct = userAns === qItem.correct;
              return (
                <div key={i} style={{ borderBottom:"1px solid rgba(255,255,255,0.08)", paddingBottom:16, marginBottom:16 }}>
                  <div style={{ display:"flex", alignItems:"flex-start", gap:10, marginBottom:8 }}>
                    <span style={{ background:correct?"#059669":"#DC2626", color:"#fff", borderRadius:6, padding:"2px 8px", fontSize:12, fontWeight:800, flexShrink:0 }}>Q{i+1}</span>
                    <span style={{ color:"rgba(255,255,255,0.8)", fontSize:13, lineHeight:1.5 }}>{qItem.q.slice(0,120)}…</span>
                  </div>
                  <div style={{ paddingLeft:36, display:"flex", gap:12, flexWrap:"wrap" }}>
                    <span style={{ fontSize:12, color:correct?"#6EE7B7":"#FCA5A5" }}>Your answer: <b>{userAns!==undefined?["A","B","C","D"][userAns]:"Not answered"}</b></span>
                    {!correct && <span style={{ fontSize:12, color:"#6EE7B7" }}>Correct: <b>{["A","B","C","D"][qItem.correct]}</b></span>}
                  </div>
                </div>
              );
            })}
          </div>

          {/* Buttons */}
          <div style={{ display:"flex", gap:12, justifyContent:"center", flexWrap:"wrap" }}>
            <button onClick={() => { setPaperId(null); setScreen("home"); }}
              style={{ padding:"14px 32px", borderRadius:12, border:"2px solid rgba(255,255,255,0.3)", background:"rgba(255,255,255,0.1)", color:"#fff", fontWeight:700, cursor:"pointer", fontSize:15 }}>
              ← Back to Home
            </button>
            <button onClick={openDashboard}
              style={{ padding:"14px 32px", borderRadius:12, border:"none", background:"#0D9488", color:"#fff", fontWeight:700, cursor:"pointer", fontSize:15 }}>
              📊 View All Results
            </button>
          </div>
        </div>
      </div>
    );
  }

  // ─── DASHBOARD ─────────────────────────────────────────────────
  if (screen === "dashboard") {
    const paper1Results = dashData.filter(r => r.paperId === 1);
    const paper2Results = dashData.filter(r => r.paperId === 2);
    const avgPct = dashData.length ? Math.round(dashData.reduce((s,r)=>s+r.pct,0)/dashData.length) : 0;

    return (
      <div style={{ minHeight:"100vh", background:"#0F2557", fontFamily:"'Segoe UI',system-ui,sans-serif" }}>
        {/* Header */}
        <div style={{ background:"#0A1628", borderBottom:"1px solid rgba(255,255,255,0.1)", padding:"20px 32px", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
          <div>
            <div style={{ color:"#0D9488", fontSize:11, fontWeight:700, letterSpacing:2, marginBottom:4 }}>TRAINER DASHBOARD</div>
            <h1 style={{ color:"#fff", fontSize:24, fontWeight:800, margin:0 }}>Student Progress Overview</h1>
          </div>
          <div style={{ display:"flex", gap:10 }}>
            <button onClick={() => { setTrainerAuth(false); setScreen("home"); }}
              style={{ padding:"10px 20px", borderRadius:10, border:"1px solid rgba(255,255,255,0.2)", background:"rgba(255,255,255,0.06)", color:"#BAE6FD", fontWeight:600, cursor:"pointer", fontSize:13 }}>
              🔒 Lock & Exit
            </button>
            <button onClick={() => setScreen("home")}
              style={{ padding:"10px 16px", borderRadius:10, border:"1px solid rgba(255,255,255,0.15)", background:"rgba(255,255,255,0.04)", color:"rgba(255,255,255,0.5)", fontWeight:500, cursor:"pointer", fontSize:13 }}>
              ← Home
            </button>
          </div>
        </div>

        <div style={{ maxWidth:1100, margin:"0 auto", padding:"28px 20px" }}>
          {dashLoading ? (
            <div style={{ textAlign:"center", padding:80, color:"#BAE6FD", fontSize:18 }}>Loading results...</div>
          ) : dashData.length === 0 ? (
            <div style={{ textAlign:"center", padding:80 }}>
              <div style={{ fontSize:48, marginBottom:16 }}>📭</div>
              <p style={{ color:"#BAE6FD", fontSize:18 }}>No submissions yet. Share the app link with students to get started.</p>
            </div>
          ) : (
            <>
              {/* Stats row */}
              <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:16, marginBottom:28 }}>
                {[
                  ["Total Attempts", dashData.length, "📝", "#1D4ED8"],
                  ["Average Score", avgPct+"%", "📊", "#0D9488"],
                  ["Paper 1 Attempts", paper1Results.length, "📋", "#5B21B6"],
                  ["Paper 2 Attempts", paper2Results.length, "🎯", "#7C3AED"],
                ].map(([label, val, icon, color]) => (
                  <div key={label} style={{ background:"rgba(255,255,255,0.06)", border:"1px solid rgba(255,255,255,0.1)", borderRadius:14, padding:"20px 18px", borderTop:`3px solid ${color}` }}>
                    <div style={{ fontSize:24, marginBottom:8 }}>{icon}</div>
                    <div style={{ color:"#fff", fontSize:26, fontWeight:800 }}>{val}</div>
                    <div style={{ color:"rgba(255,255,255,0.5)", fontSize:12, marginTop:4 }}>{label}</div>
                  </div>
                ))}
              </div>

              {/* Results table */}
              <div style={{ background:"rgba(255,255,255,0.04)", border:"1px solid rgba(255,255,255,0.1)", borderRadius:16, overflow:"hidden" }}>
                <div style={{ padding:"18px 24px", borderBottom:"1px solid rgba(255,255,255,0.1)", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                  <h2 style={{ color:"#fff", fontSize:17, fontWeight:700, margin:0 }}>All Submissions</h2>
                  <span style={{ color:"rgba(255,255,255,0.4)", fontSize:13 }}>Most recent first</span>
                </div>

                {/* Table header */}
                <div style={{ display:"grid", gridTemplateColumns:"2fr 1fr 1fr 1fr 1fr 1.5fr", gap:0, borderBottom:"1px solid rgba(255,255,255,0.08)" }}>
                  {["Student Name","Paper","Score","Percentage","Grade","Date & Time"].map(h => (
                    <div key={h} style={{ padding:"10px 16px", color:"rgba(255,255,255,0.4)", fontSize:11, fontWeight:700, letterSpacing:1 }}>{h}</div>
                  ))}
                </div>

                {dashData.map((r, i) => {
                  const grade = getGrade(r.pct);
                  const d = new Date(r.ts);
                  return (
                    <div key={i} style={{ display:"grid", gridTemplateColumns:"2fr 1fr 1fr 1fr 1fr 1.5fr", borderBottom:"1px solid rgba(255,255,255,0.06)", background: i%2===0?"transparent":"rgba(255,255,255,0.02)" }}>
                      <div style={{ padding:"14px 16px", color:"#fff", fontWeight:600, fontSize:14 }}>{r.name}</div>
                      <div style={{ padding:"14px 16px" }}>
                        <span style={{ background: r.paperId===1?"rgba(29,78,216,0.3)":"rgba(91,33,182,0.3)", color: r.paperId===1?"#93C5FD":"#C4B5FD", borderRadius:100, padding:"3px 10px", fontSize:12, fontWeight:700 }}>
                          Paper {r.paperId}
                        </span>
                      </div>
                      <div style={{ padding:"14px 16px", color:"#fff", fontWeight:700, fontSize:16 }}>{r.score}/{r.total}</div>
                      <div style={{ padding:"14px 16px" }}>
                        <span style={{ color: r.pct>=70?"#6EE7B7":r.pct>=50?"#FCD34D":"#FCA5A5", fontWeight:800, fontSize:16 }}>{r.pct}%</span>
                      </div>
                      <div style={{ padding:"14px 16px" }}>
                        <span style={{ background:grade.bg, color:grade.color, borderRadius:100, padding:"3px 10px", fontSize:11, fontWeight:700 }}>{grade.label}</span>
                      </div>
                      <div style={{ padding:"14px 16px", color:"rgba(255,255,255,0.5)", fontSize:12 }}>
                        {d.toLocaleDateString()} {d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}
                      </div>
                    </div>
                  );
                })}
              </div>

              {/* Per-student breakdown */}
              <div style={{ marginTop:28 }}>
                <h2 style={{ color:"#fff", fontSize:18, fontWeight:700, marginBottom:16 }}>Student Progress Details</h2>
                <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(320px,1fr))", gap:16 }}>
                  {[...new Map(dashData.map(r=>[r.name, dashData.filter(d=>d.name===r.name)])).entries()].map(([name, attempts]) => {
                    const best = attempts.reduce((b,a)=>a.pct>b.pct?a:b, attempts[0]);
                    const avg2 = Math.round(attempts.reduce((s,a)=>s+a.pct,0)/attempts.length);
                    return (
                      <div key={name} style={{ background:"rgba(255,255,255,0.05)", border:"1px solid rgba(255,255,255,0.1)", borderRadius:14, padding:"20px" }}>
                        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:14 }}>
                          <div>
                            <div style={{ color:"#fff", fontWeight:700, fontSize:16 }}>{name}</div>
                            <div style={{ color:"rgba(255,255,255,0.4)", fontSize:12 }}>{attempts.length} attempt{attempts.length>1?"s":""}</div>
                          </div>
                          <div style={{ textAlign:"right" }}>
                            <div style={{ color: best.pct>=70?"#6EE7B7":"#FCA5A5", fontWeight:800, fontSize:20 }}>{best.pct}%</div>
                            <div style={{ color:"rgba(255,255,255,0.4)", fontSize:11 }}>best score</div>
                          </div>
                        </div>
                        {attempts.map((a,ai) => (
                          <div key={ai} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", background:"rgba(255,255,255,0.04)", borderRadius:8, padding:"8px 12px", marginBottom:6 }}>
                            <span style={{ color:"rgba(255,255,255,0.6)", fontSize:12 }}>Paper {a.paperId} · {new Date(a.ts).toLocaleDateString()}</span>
                            <span style={{ color: a.pct>=70?"#6EE7B7":a.pct>=50?"#FCD34D":"#FCA5A5", fontWeight:700, fontSize:14 }}>{a.score}/{a.total} ({a.pct}%)</span>
                          </div>
                        ))}
                      </div>
                    );
                  })}
                </div>
              </div>
            </>
          )}
        </div>
      </div>
    );
  }

  return null;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>

</body>
</html>
